  // ---------- injuries box (Carlos, 2026-09-09) ----------
  // g.injuries is always present in the payload (build_game_json always emits the
  // key) but injuries.home/injuries.away are null, not an empty list, when that
  // team has no injuries pulled yet -- run/08b_injuries.py is manual/on-demand
  // (Carlos's choice), not part of every pipeline run, so a null here means "not
  // checked", shown as "No data", never rendered as "confirmed healthy". Key skill
  // positions only (QB/RB/WR/TE) -- filtered server-side in nfl_modeling_view.sql,
  // an O-line/D-line/special-teams injury never reaches this payload.
  function injuryStatusClass(status){
    var s = (status||'').toLowerCase();
    if (s.indexOf('out') === 0 || s === 'ir' || s.indexOf('injured reserve') >= 0 ||
        s.indexOf('sidelined') === 0 || s === 'i.l.' || s === 'pup' || s === 'nfi') return 'out';
    if (s.indexOf('doubtful') === 0) return 'doubtful';
    if (s.indexOf('questionable') === 0) return 'questionable';
    return '';
  }
  // 2026-10-05 (Carlos): every position now, not only QB/RB/WR/TE. g.injuries.allPositions is true when the
  // payload came from nfl.v_team_all_injuries; each entry then carries leaderIn (which of the team's top-3 leader
  // categories the player is in) and is already sorted leaders-first, then by severity. Position is blank for
  // players the roster pull doesn't know (never guessed). First 8 per team shown, the rest under "more".
  var LEADER_ABBR = {passing:'PASS', rushing:'RUSH', receiving:'REC', tackles:'TKL', sacks:'SACK', interceptions:'INT'};
  function injuryRowHtml(p){
    var cls = injuryStatusClass(p.status);
    var badge = (p.leaderIn && p.leaderIn.length)
      ? '<span class="injury-badge" title="Top-3 on this team in: '+esc(p.leaderIn.join(', '))+'">LEADER · '+
        esc(p.leaderIn.map(function(c){ return LEADER_ABBR[c]||c; }).join('/'))+'</span>' : '';
    return '<div class="injury-row" title="'+esc(p.description||'')+'">'+
      '<span class="injury-name">'+esc(p.playerName)+(p.position?' <span class="injury-pos">'+esc(p.position)+'</span>':'')+badge+'</span>'+
      '<span class="injury-status'+(cls?' '+cls:'')+'">'+esc(p.status||'–')+'</span>'+
    '</div>';
  }
  function injuryListHtml(list){
    if (!list || !list.length) return '<div class="injury-empty">No data</div>';
    var shown = list.slice(0, 8).map(injuryRowHtml).join('');
    var rest = list.slice(8);
    if (!rest.length) return shown;
    return shown + '<details class="injury-more"><summary>'+rest.length+' more</summary>'+rest.map(injuryRowHtml).join('')+'</details>';
  }
  function injuriesHtml(g){
    var inj = g.injuries||{};
    var home = g.home||{}, away = g.away||{};
    return '<div class="h2h-box">'+
      '<h4><span>Injuries</span><span class="h2h-meta">'+(inj.allPositions?'All positions':'QB/RB/WR/TE')+'</span></h4>'+
      '<div class="injury-col-label">'+esc(teamLabel(away))+'</div>'+
      injuryListHtml(inj.away)+
      '<div class="injury-col-label">'+esc(teamLabel(home))+'</div>'+
      injuryListHtml(inj.home)+
    '</div>';
  }

  // ---------- team leaders box (Carlos, 2026-10-05) ----------
  // g.leaders.home/away = {passing:[...], rushing:[...], receiving:[...], tackles:[...], sacks:[...],
  // interceptions:[...]}, top 3 each, season to date (nfl_leaders_view.sql). null = no completed games with
  // player stats for that team yet -> "No data", never a blank that reads as "no leaders".
  function fmtN(n){
    if (n == null) return '–';
    n = Number(n);
    return (n % 1 ? n.toFixed(1) : String(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function perGame(total, games, digits){
    return (games > 0 && total != null) ? (Number(total)/games).toFixed(digits == null ? 1 : digits) : null;
  }
  // Each category: main = season total of the headline stat, avg = that stat per game played, sub = the other
  // counting stats with their own per-game average in parentheses (games = games the player appeared in).
  function withAvg(total, games, label, digits){
    var a = perGame(total, games, digits);
    return fmtN(total) + ' ' + label + (a != null ? ' (' + a + '/g)' : '');
  }
  var LEAD_DEFS = [
    {key:'passing',       label:'Passing',
      main:function(p){ return fmtN(p.stats.yds)+' yds'; },
      avg:function(p){ var a=perGame(p.stats.yds,p.games); return a?a+' yds/g':''; },
      sub:function(p){ return withAvg(p.stats.td,p.games,'TD',2)+' · '+fmtN(p.stats['int'])+' INT'; }},
    {key:'rushing',       label:'Rushing',
      main:function(p){ return fmtN(p.stats.yds)+' yds'; },
      avg:function(p){ var a=perGame(p.stats.yds,p.games); return a?a+' yds/g':''; },
      sub:function(p){ return withAvg(p.stats.att,p.games,'att')+' · '+fmtN(p.stats.td)+' TD'; }},
    {key:'receiving',     label:'Receiving',
      main:function(p){ return fmtN(p.stats.yds)+' yds'; },
      avg:function(p){ var a=perGame(p.stats.yds,p.games); return a?a+' yds/g':''; },
      sub:function(p){ return withAvg(p.stats.rec,p.games,'rec')+' · '+fmtN(p.stats.td)+' TD'; }},
    {key:'tackles',       label:'Defense · Tackles',  defense:true,
      main:function(p){ return fmtN(p.stats.tackles)+' tkl'; },
      avg:function(p){ var a=perGame(p.stats.tackles,p.games); return a?a+' tkl/g':''; },
      sub:function(p){ return fmtN(p.stats.tfl)+' TFL · '+fmtN(p.stats.passDef)+' PD'; }},
    {key:'sacks',         label:'Defense · Sacks',    defense:true,
      main:function(p){ return fmtN(p.stats.sacks)+' sk'; },
      avg:function(p){ var a=perGame(p.stats.sacks,p.games,2); return a?a+' sk/g':''; },
      sub:function(p){ return fmtN(p.stats.tackles)+' tkl'; }},
    {key:'interceptions', label:'Defense · INTs',     defense:true,
      main:function(p){ return fmtN(p.stats['int'])+' int'; },
      avg:function(p){ var a=perGame(p.stats['int'],p.games,2); return a?a+' int/g':''; },
      sub:function(p){ return fmtN(p.stats.passDef)+' PD'; }}
  ];
  function leaderSectionHtml(def, lead, away, home){
    function col(team, side){
      var list = lead && lead[side] ? lead[side][def.key] : null;
      if (!list || !list.length) return '<div><div class="lead-team">'+esc(teamLabel(team))+'</div><div class="injury-empty">–</div></div>';
      return '<div><div class="lead-team">'+esc(teamLabel(team))+'</div>'+list.map(function(p){
        return '<div class="lead-row"><div class="lead-top"><span class="lead-name">'+esc(p.playerName)+
          (p.position?' <span class="injury-pos">'+esc(p.position)+'</span>':'')+' <span class="lead-g">'+p.games+' G</span></span>'+
          '<span class="lead-main">'+esc(def.main(p))+'</span></div>'+
          '<div class="lead-sub"><span>'+esc(def.sub(p))+'</span><span class="lead-avg">'+esc(def.avg(p))+'</span></div></div>';
      }).join('')+'</div>';
    }
    return '<div class="lead-cat">'+esc(def.label)+'</div><div class="lead-grid">'+col(away,'away')+col(home,'home')+'</div>';
  }
  function leadersHtml(g){
    var lead = g.leaders||{};
    if (!lead.home && !lead.away) {
      return '<div class="h2h-box"><h4><span>Team Leaders</span><span class="h2h-meta">season to date</span></h4><div class="h2h-empty">No data</div></div>';
    }
    var away = g.away||{}, home = g.home||{};
    var offense = LEAD_DEFS.filter(function(d){ return !d.defense; }).map(function(d){ return leaderSectionHtml(d, lead, away, home); }).join('');
    var defense = LEAD_DEFS.filter(function(d){ return d.defense; }).map(function(d){ return leaderSectionHtml(d, lead, away, home); }).join('');
    return '<div class="h2h-box"><h4><span>Team Leaders</span><span class="h2h-meta">season to date · top 3 · avg per game played</span></h4>'+
      offense+'<details class="lead-more"><summary>Defense leaders</summary>'+defense+'</details></div>';
  }

  // 2026-10-05 addition (Carlos): each prop row also carries the opposing defense's per-game average allowed for that stat
  // (defAvg / defL3 / defLg / defGames from nfl.v_team_defense_allowed) -- see defLineHtml.
  // ---------- player props vs. averages box (Carlos, 2026-10-05) ----------
  // g.props = {home:[...], away:[...], asOf}. Each entry: one player + one market with the consensus posted line,
  // best over/under (or yes) price, and the player's season / last-3 per-game average (per game appeared in).
  // Context only, not a pick: lines come from 1-2 books and are posted about a day before kickoff; averages
  // ignore opponent and role changes. Anytime TD compares the share of games with a rush/rec TD to the implied
  // probability of the posted price (no vig removed). Whole section is absent until props are posted.
  var PROP_LABELS = {pass_yds:'Pass yds', pass_cmp:'Completions', pass_td:'Pass TD', pass_int:'INT thrown', rush_yds:'Rush yds',
    rush_att:'Rush att', rec_yds:'Rec yds', rush_rec_yds:'Rush+Rec yds', pass_rush_yds:'Pass+Rush yds', anytime_td:'Anytime TD'};
  function fmtOdd(o){ return o == null ? '–' : (o > 0 ? '+' + o : String(o)); }
  function fmtAvg(x, market){
    if (x == null) return '–';
    if (market === 'anytime_td') return Math.round(x*100) + '%';
    return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1));
  }
  // Opposing defense's per-game average allowed for the same stat (team totals) vs. the league average.
  // "More allowed = friendlier to an over" holds for every market (INT thrown: more INTs taken by that D).
  // Green/red when at least 10% above/below the league average. Anytime TD = rushing + receiving TDs allowed per game.
  function fmtDef(x, market){
    if (x == null) return '–';
    if (market === 'anytime_td' || market === 'pass_td' || market === 'pass_int') return x.toFixed(2);
    return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1));
  }
  function defLineHtml(r, opp){
    if (r.defAvg == null || !r.defGames) return '';
    var rel = (r.defLg ? (r.defAvg - r.defLg) / r.defLg : 0);
    var cls = rel >= 0.10 ? 'soft' : (rel <= -0.10 ? 'tough' : '');
    var pct = r.defLg ? ((rel > 0 ? '+' : '') + Math.round(rel*100) + '% vs lg') : '';
    var unit = r.market === 'anytime_td' ? ' TD/g' : '/g';
    return '<span class="prop-def">'+esc(teamLabel(opp))+' D allows <b'+(cls?' class="'+cls+'"':'')+'>'+esc(fmtDef(r.defAvg, r.market))+unit+'</b>'+
      (r.defLg != null ? ' · lg '+esc(fmtDef(r.defLg, r.market)) : '')+
      (pct ? ' · <span'+(cls?' class="'+cls+'"':'')+'>'+esc(pct)+'</span>' : '')+
      (r.defL3 != null && r.defGames > 3 ? ' · L3 '+esc(fmtDef(r.defL3, r.market)) : '')+
      ' <span class="prop-sub">('+r.defGames+' G)</span></span>';
  }
  function propRowHtml(r, opp){
    var isTd = r.market === 'anytime_td';
    var lineCell, gapTxt = '', gapCls = '', oddsLine = '';
    if (isTd){
      var imp = r.yesDec ? 1 / r.yesDec : null;
      lineCell = fmtOdd(r.yesOdd) + (imp != null ? ' <span class="prop-sub">'+Math.round(imp*100)+'%</span>' : '');
      if (imp != null && r.avg != null){
        var pts = (r.avg - imp) * 100;
        gapTxt = (pts > 0 ? '+' : '') + Math.round(pts) + '% vs price';
        gapCls = pts >= 10 ? 'up' : (pts <= -10 ? 'down' : '');
      }
    } else {
      lineCell = r.line != null ? r.line.toFixed(1) : '–';
      if (r.avg != null && r.line != null){
        var diff = r.avg - r.line;
        gapTxt = (diff > 0 ? '+' : '') + (Math.abs(diff) >= 100 ? diff.toFixed(0) : diff.toFixed(1));
        var rel = r.line ? diff / r.line : 0;
        gapCls = rel >= 0.10 ? 'up' : (rel <= -0.10 ? 'down' : '');
      }
      oddsLine = 'O '+fmtOdd(r.overOdd)+' · U '+fmtOdd(r.underOdd);
    }
    var range = (!isTd && r.lineMin != null && r.lineMax != null && r.lineMin !== r.lineMax) ? ' · lines '+r.lineMin.toFixed(1)+'–'+r.lineMax.toFixed(1) : '';
    var sub = (oddsLine ? oddsLine + ' · ' : '') + r.books + ' book' + (r.books === 1 ? '' : 's') + range;
    return '<div class="prop-row">'+
      '<span>'+esc(PROP_LABELS[r.market]||r.market)+'</span>'+
      '<span class="num">'+lineCell+'</span>'+
      '<span class="num">'+esc(fmtAvg(r.avg, r.market))+'</span>'+
      '<span class="num">'+esc(fmtAvg(r.last3, r.market))+'</span>'+
      '<span class="num prop-gap'+(gapCls?' '+gapCls:'')+'">'+esc(gapTxt||'–')+'</span>'+
      '<span class="prop-odds">'+esc(sub)+'</span>'+
      defLineHtml(r, opp)+
    '</div>';
  }
  function propsTeamHtml(team, list, opp){
    var rows = (list||[]).filter(function(r){ return r.avg != null && r.games > 0; });
    if (!rows.length) return '';
    var byPlayer = [], seen = {};
    rows.forEach(function(r){
      if (!seen[r.player]) { seen[r.player] = {name:r.player, pos:r.pos, games:r.games, rows:[]}; byPlayer.push(seen[r.player]); }
      seen[r.player].rows.push(r);
    });
    return '<div class="injury-col-label">'+esc(teamLabel(team))+'</div>'+
      '<div class="prop-head"><span>Prop</span><span class="num">Line</span><span class="num">Avg</span><span class="num">L3</span><span class="num">Avg–line</span></div>'+
      byPlayer.map(function(p){
        return '<div class="prop-player">'+esc(p.name)+(p.pos?' <span class="injury-pos">'+esc(p.pos)+'</span>':'')+
               ' <span class="prop-sub">'+p.games+' G</span></div>'+p.rows.map(function(r){ return propRowHtml(r, opp); }).join('');
      }).join('');
  }
  function propsHtml(g){
    var pr = g.props||{};
    var away = g.away||{}, home = g.home||{};
    var body = propsTeamHtml(away, pr.away, home) + propsTeamHtml(home, pr.home, away);
    if (!body) return '';
    var n = ((pr.away||[]).length + (pr.home||[]).length);
    return '<div class="h2h-box"><details class="lead-more" open style="margin:0"><summary><b>Player props vs. averages</b> <span class="h2h-meta">'+n+' lines'+(pr.asOf?' · pulled '+esc(fmtDate(pr.asOf.slice(0,10))):'')+'</span></summary>'+
      body+
      '<div class="prop-note">Avg = season per game played, L3 = last 3 games. Green/red = average at least 10% above/below the line. '+
      '"D allows" = what the opposing defense gives up per game on that stat (the other offense\'s team total, season to date), next to the league average; green = at least 10% more than league (softer matchup), red = at least 10% less. Pass TD / INT / completions use team passing totals; Rush+Rec and Pass+Rush use team yardage totals. '+
      'Anytime TD: Avg is the % of games with a rushing/receiving TD; the right-hand number is that minus the chance the price implies (80% vs a +100 price at 50% = +30%). Lines come from 1–2 books and are posted about a day before kickoff. Context, not a pick.</div>'+
    '</details></div>';
  }

  // ---------- recent form box (Carlos, 2026-09-10) ----------
  // g.form is always present (build_game_json always emits the key) but
  // form.home/form.away are null field-by-field, not fabricated zeros, for a
  // team with zero completed games (a brand-new franchise, or before Week 1)
  // -- same "never fabricate" convention as injuries above. recentGames comes
  // most-recent-first from the backend; reversed here so the chip row reads
  // oldest-to-newest left-to-right, ending at "now" on the right.
  function formStreakLabel(result, length){
    if (!result || !isNum(length) || length <= 0) return '';
    return result + length;
  }
  function formRecordHtml(f){
    if (!f || !isNum(f.gamesPlayed) || f.gamesPlayed <= 0) return '<div class="form-empty">No data</div>';
    var record = f.wins + '-' + f.losses + (f.ties ? '-' + f.ties : '');
    var streak = formStreakLabel(f.streakResult, f.streakLength);
    var streakCls = f.streakResult === 'W' ? 'w' : (f.streakResult === 'L' ? 'l' : '');
    var chips = (f.recentGames||[]).slice().reverse().map(function(rg){
      var cls = rg.result === 'W' ? 'w' : (rg.result === 'L' ? 'l' : 't');
      return '<span class="form-chip '+cls+'" title="'+esc(fmtDate(rg.date))+': '+rg.pointsScored+'-'+rg.pointsAllowed+'">'+esc(rg.result)+'</span>';
    }).join('');
    return '<div class="form-row"><span>Last '+f.gamesPlayed+': <b>'+esc(record)+'</b>'+
        (streak?' <span class="form-streak '+streakCls+'">'+esc(streak)+'</span>':'')+'</span>'+
      '<span>'+fmtNum(f.avgScored,1)+' / '+fmtNum(f.avgAllowed,1)+' avg</span></div>'+
      '<div class="form-chips">'+chips+'</div>';
  }
  function formHtml(g){
    var form = g.form||{};
    var home = g.home||{}, away = g.away||{};
    return '<div class="h2h-box">'+
      '<h4><span>Recent Form</span><span class="h2h-meta">Last 5</span></h4>'+
      '<div class="injury-col-label">'+esc(teamLabel(away))+'</div>'+
      formRecordHtml(form.away)+
      '<div class="injury-col-label">'+esc(teamLabel(home))+'</div>'+
      formRecordHtml(form.home)+
    '</div>';
  }

  // 2026-09-11 rewrite: this used to sort computeEdgeEntries() by raw |edge|
  // and show whichever won -- no floor (a thin-sample N=1 edge could lead
  // the board) and a live tie-break bug (home ML and away ML edges are
  // near-mirror images, so JS's stable sort kept the home side on a tie
  // regardless of which side actually had the positive edge -- confirmed
  // live on the Rutgers @ Boston College card, which banner'd "Boston
  // College ML -12.1% edge" when the real pick was Rutgers ML at +12.1%).
  // Best Bet now comes from the server (g.picks.bestBet, computed by
  // nfl.v_future_games_scored -- see nfl_scoring_view.sql for the full v1
  // scoring rule), which already fixes both problems: only positive-edge
  // sides are ever candidates, and a sample-size cap knocks a thin-data
  // edge down instead of letting it win. This function's only job now is
  // to find that market/side's already-correctly-formatted label (from
  // computeEdgeEntries, so the label text never drifts out of sync with
  // the rest of the card) and render it, or show Skip when every market
  // PASSed.
  function topEdgeTeaser(g){
    var best = (g.picks || {}).bestBet;
    if (!best) return '<div class="bb-line pass">Skip — no picks clear the bar</div>';
    var entries = computeEdgeEntries(g);
    var match = entries.filter(function(e){ return e.marketKey === best.market && e.side === best.side; })[0];
    if (!match) return '<div class="bb-line pass">Skip — no picks clear the bar</div>';
    return '<div class="bb-line"><span>'+esc(match.label)+'</span>'+
      '<span class="stars" title="'+best.star+' star'+(best.star===1?'':'s')+'">'+'★'.repeat(best.star)+'</span>'+
      '<span class="edge-pct">'+fmtEdgePct(best.edge)+' edge</span></div>';
  }

  function cardHtml(g){
    var dayLabel = fmtDate(g.date) + (fmtTime(g.time) ? ' · ' + fmtTime(g.time) : '');
    return '<div class="card" data-gameid="'+esc(g.id)+'">'+
      '<div class="summary" data-toggle="'+esc(g.id)+'">'+
        '<div class="league-row"><span>'+esc(weekLabel(g))+'</span><span class="time">'+esc(dayLabel)+'</span></div>'+
        '<div class="matchup">'+
          '<div class="team">'+badge(teamLabel(g.away), (g.away||{}).logo)+'<span>'+esc((g.away||{}).name||teamLabel(g.away))+'</span></div>'+
          '<div class="vs">@</div>'+
          '<div class="team" style="justify-content:flex-end; text-align:right;"><span>'+esc((g.home||{}).name||teamLabel(g.home))+'</span>'+badge(teamLabel(g.home), (g.home||{}).logo)+'</div>'+
        '</div>'+
        topEdgeTeaser(g)+
      '</div>'+
      '<div class="expand" id="expand-'+esc(g.id)+'">'+
        snapshotHtml(g)+
        h2hHtml(g)+
        leadersHtml(g)+
        propsHtml(g)+
        injuriesHtml(g)+
        formHtml(g)+
        marketsHtml(g)+
      '</div>'+
    '</div>';
  }

  // ---------- Games tab / filters ----------
  // Date + Kickoff filters (added 2026-09-10, Carlos: "add the Date and Kickoff
  // time filters the same as in the Match Day Dashboard") -- mirrors Match Day
  // Board's Fixtures-tab f-day/f-time pattern exactly (same dropdown-panel CSS,
  // already present in this file but unused until now), adapted to this
  // dashboard's g.date/g.time fields instead of fx.date/fx.ts.
  var timeSet = [];
  var timeSelected = new Set();

  function buildDayOptions(){
    var days = Array.from(new Set(GAMES.map(function(g){ return g.date; }))).filter(Boolean).sort();
    var sel = document.getElementById('f-day');
    days.forEach(function(d){
      var o = document.createElement('option'); o.value = d; o.textContent = fmtDate(d); sel.appendChild(o);
    });
  }

  function buildTimeOptions(){
    timeSet = Array.from(new Set(GAMES.map(function(g){ return fmtTime(g.time); }))).filter(Boolean).sort(function(a,b){
      // sort chronologically by parsing back to minutes-ish (same trick as Match Day Board's f-time)
      function toMinutes(t){
        var m = t.match(/(\d+):(\d+)\s*([AP]M)/i);
        if(!m) return 0;
        var h = parseInt(m[1],10)%12; if(/pm/i.test(m[3])) h+=12;
        return h*60+parseInt(m[2],10);
      }
      return toMinutes(a)-toMinutes(b);
    });
    timeSelected = new Set(timeSet);
    renderTimeOptions();
    updateTimeCount();
  }
  function renderTimeOptions(){
    var box = document.getElementById('time-options');
    box.innerHTML = timeSet.map(function(t){
      var checked = timeSelected.has(t) ? 'checked' : '';
      return '<label><input type="checkbox" value="'+esc(t)+'" '+checked+' class="time-cb"> '+esc(t)+'</label>';
    }).join('');
    box.querySelectorAll('.time-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        if (cb.checked) timeSelected.add(cb.value); else timeSelected.delete(cb.value);
        updateTimeCount(); renderGames();
      });
    });
  }
  function updateTimeCount(){
    var tc = document.getElementById('f-time-count');
    tc.textContent = (timeSelected.size && timeSelected.size < timeSet.length) ? '('+timeSelected.size+')' : '';
  }
  function openPanel(panel){
    document.getElementById('scrim').classList.add('open');
    panel.classList.add('open');
    panel.style.top = '90px';
  }
  function closeAllPanels(){
    document.querySelectorAll('.dropdown-panel').forEach(function(p){ p.classList.remove('open'); });
    document.getElementById('scrim').classList.remove('open');
  }

  function weekSortKey(g){
    return {week: g.week, weekNumber: g.weekNumber, date: g.date};
  }
  function buildWeekOptions(){
    var seen = {};
    var weeks = [];
    GAMES.forEach(function(g){
      var w = g.week;
      if (!w || seen[w]) return;
      seen[w] = true;
      weeks.push({week: w, weekNumber: g.weekNumber, date: g.date});
    });
    weeks.sort(function(a,b){
      var an = a.weekNumber, bn = b.weekNumber;
      if (an!=null && bn!=null) return an-bn;
      if (an!=null) return -1;
      if (bn!=null) return 1;
      return (a.date||'').localeCompare(b.date||'');
    });
    var sel = document.getElementById('f-week');
    weeks.forEach(function(w){
      var o = document.createElement('option'); o.value = w.week; o.textContent = w.week; sel.appendChild(o);
    });
  }

  function passesGameFilters(g){
    var week = document.getElementById('f-week').value;
    if (week && g.week !== week) return false;
    var day = document.getElementById('f-day').value;
    if (day && g.date !== day) return false;
    if (timeSet.length && timeSelected.size < timeSet.length && !timeSelected.has(fmtTime(g.time))) return false;
    var teamQ = document.getElementById('f-team').value.trim().toLowerCase();
    if (teamQ) {
      var home = g.home||{}, away = g.away||{};
      var hay = [home.name, home.code, away.name, away.code].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(teamQ) === -1) return false;
    }
    return true;
  }

  function renderGames(){
    var list = GAMES.filter(passesGameFilters);
    document.getElementById('gameList').innerHTML = list.length
      ? list.map(cardHtml).join('')
      : '<div class="empty">No games match these filters.</div>';
  }

  // ---------- expand/collapse + track/odds delegation ----------
  document.addEventListener('click', function(e){
    var toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      var card = toggle.closest('.card');
      var ex = card ? card.querySelector('.expand') : null;
      if (ex) ex.classList.toggle('open');
      return;
    }
    var trackBtn = e.target.closest('[data-track]');
    if (trackBtn) {
      e.stopPropagation();
      toggleTrack(trackBtn);
      return;
    }
  });
  document.addEventListener('change', function(e){
    var oddsEl = e.target.closest('[data-oddsinput]');
    if (oddsEl) {
      updateOddsFromMarketRow(oddsEl.getAttribute('data-oddsinput'), oddsEl.value);
    }
  });

  document.getElementById('f-week').addEventListener('change', renderGames);
  document.getElementById('f-day').addEventListener('change', renderGames);
  document.getElementById('f-time-btn').addEventListener('click', function(){ openPanel(document.getElementById('f-time-panel')); });
  document.getElementById('scrim').addEventListener('click', closeAllPanels);
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeAllPanels); });
  document.getElementById('time-all').addEventListener('click', function(){ timeSelected = new Set(timeSet); renderTimeOptions(); updateTimeCount(); renderGames(); });
  document.getElementById('time-clear').addEventListener('click', function(){ timeSelected = new Set(); renderTimeOptions(); updateTimeCount(); renderGames(); });
  document.getElementById('f-team').addEventListener('input', renderGames);

  // ---------- tabs ----------
  document.querySelectorAll('nav.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('section.tab').forEach(function(s){ s.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-'+btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  // ---------- tracker (Google Sheets sync via Apps Script, localStorage cache) ----------
  var TRACK_KEY = 'nflTrackerCache_v1'; // distinct from the soccer dashboard's matchDayTrackerCache_v1, so both can coexist in one browser
  var IDENTITY_KEY = 'nflIdentity_v1';
  // Carlos: deploy TrackerSync.gs on a NEW Google Sheet for NFL and paste that Web App /exec URL here
  var TRACKER_SYNC_URL = 'https://script.google.com/macros/s/AKfycbwh7lmqaGoqlU0sdyz7t03gpgOJGDhJNS0ftP07xnJpT96gTD_M9YAeE3W8kqSuqVezDQ/exec';
  var STATUS_LABELS = {pending:'Pending', won:'Won', push:'Push', lost:'Lost'};

  function getIdentity(){
    try { return JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null'); } catch(e){ return null; }
  }
  function setIdentity(name, pin){
    try { localStorage.setItem(IDENTITY_KEY, JSON.stringify({name:name, pin:pin})); } catch(e){}
  }
  function clearIdentity(){
    try { localStorage.removeItem(IDENTITY_KEY); } catch(e){}
  }
  function ensureIdentity(){
    var id = getIdentity();
    if (id && id.name && id.pin) return id;
    var name = window.prompt('Your name (as set up in the Users sheet):');
    if (!name) return null;
    var pin = window.prompt('Your PIN:');
    if (!pin) return null;
    setIdentity(name.trim(), pin.trim());
    return getIdentity();
  }

  function loadTracked(){
    try { return JSON.parse(localStorage.getItem(TRACK_KEY) || '[]'); } catch(e){ return []; }
  }
  function saveTracked(arr){
    try { localStorage.setItem(TRACK_KEY, JSON.stringify(arr)); } catch(e){}
  }
  function isTracked(baseTrackId){
    var id = getIdentity();
    if (!id) return false;
    var scoped = id.name + '::' + baseTrackId;
    return loadTracked().some(function(t){ return t.trackId === scoped; });
  }
  function findTrackedEntry(baseTrackId){
    var id = getIdentity();
    if (!id) return null;
    var scoped = id.name + '::' + baseTrackId;
    return loadTracked().filter(function(t){ return t.trackId === scoped; })[0] || null;
  }
  function baseIdFromScoped(scopedId){
    return String(scopedId).split('::').slice(1).join('::');
  }
  function syncTrackButtons(trackId, tracked){
    document.querySelectorAll('[data-track="'+trackId+'"]').forEach(function(b){
      b.textContent = tracked ? 'Tracked' : 'Track';
      b.classList.toggle('tracked', tracked);
    });
  }
  function resyncAllTrackButtons(){
    document.querySelectorAll('[data-track]').forEach(function(b){
      var baseId = b.getAttribute('data-track');
      syncTrackButtons(baseId, isTracked(baseId));
    });
  }

  function serverRowToEntry(row){
    return {
      trackId: row.track_id, name: row.name, gameId: row.fx_id, marketKey: row.market_key, side: row.side || '',
      matchLabel: row.match_label, league: row.league, date: row.date, rec: row.rec,
      stars: null,
      odds: (row.odds===''||row.odds==null) ? null : parseFloat(row.odds),
      stake: (row.stake===''||row.stake==null) ? 0 : parseFloat(row.stake),
      status: row.status || 'pending',
      addedAt: row.added_at ? (Number(row.added_at) || row.added_at) : Date.now()
    };
  }
  function entryToServerPick(entry){
    return {
      track_id: entry.trackId, name: entry.name, fx_id: entry.gameId, market_key: entry.marketKey, side: entry.side||'',
      match_label: entry.matchLabel, league: 'NFL', date: entry.date, rec: entry.rec,
      stars: null, odds: entry.odds, stake: entry.stake, status: entry.status,
      added_at: entry.addedAt, updated_at: Date.now()
    };
  }

  function postToServer(body){
    return fetch(TRACKER_SYNC_URL, { method: 'POST', body: JSON.stringify(body) }).then(function(r){ return r.json(); });
  }
  function syncFromServer(){
    return fetch(TRACKER_SYNC_URL).then(function(r){ return r.json(); }).then(function(data){
      if (!data || !data.ok || !Array.isArray(data.picks)) return;
      saveTracked(data.picks.map(serverRowToEntry));
      renderTracker();
      resyncAllTrackButtons();
    }).catch(function(){ /* offline, unreachable, or placeholder URL not yet configured -- keep showing the last-synced cache */ });
  }

  function stakeForWin1(odds){
    return (odds == null || isNaN(odds)) ? 1 :
      Math.round((odds > 0 ? (100/odds) : (Math.abs(odds)/100)) * 100) / 100;
  }
  function profitFor(entry){
    if (entry.status==='pending' || entry.status==='push') return 0;
    var odds = (entry.odds!=null && entry.odds!=='') ? parseFloat(entry.odds) : null;
    if (isNaN(odds)) odds = null;
    var stake = parseFloat(entry.stake) || 0;
    var fullWinProfit = odds==null ? stake : (odds > 0 ? stake * (odds/100) : stake / (Math.abs(odds)/100));
    if (entry.status==='lost') return -stake;
    return fullWinProfit; // won
  }

  function toggleTrack(btn){
    var baseTrackId = btn.getAttribute('data-track');
    var gameId = btn.getAttribute('data-game');
    var marketKey = btn.getAttribute('data-market');
    var side = btn.getAttribute('data-side');
    var label = btn.getAttribute('data-label');
    var edgeAttr = btn.getAttribute('data-edge');
    var identity = ensureIdentity();
    if (!identity) return;
    var scopedId = identity.name + '::' + baseTrackId;
    var arr = loadTracked();
    var idx = arr.findIndex(function(t){ return t.trackId===scopedId; });
    if (idx !== -1) {
      var removed = arr[idx];
      arr.splice(idx,1);
      saveTracked(arr);
      syncTrackButtons(baseTrackId, false);
      syncOddsInputs(baseTrackId, null);
      renderTracker();
      var revert = function(){
        var arr2 = loadTracked(); arr2.push(removed); saveTracked(arr2);
        syncTrackButtons(baseTrackId, true);
        syncOddsInputs(baseTrackId, removed.odds);
        renderTracker();
      };
      postToServer({action:'delete', name:identity.name, pin:identity.pin, trackId: scopedId}).then(function(res){
        if (!res || !res.ok) { revert(); alert('Could not remove: ' + ((res&&res.error)||'server error')); }
      }).catch(function(){ revert(); alert('Could not reach the tracker sheet -- change not saved.'); });
    } else {
      var g = findGame(gameId);
      if (!g) return;
      var oddsInputEl = btn.closest('.market-actions') && btn.closest('.market-actions').querySelector('[data-oddsinput]');
      var typedOdds = oddsInputEl && oddsInputEl.value !== '' ? parseFloat(oddsInputEl.value) : NaN;
      var trackOdds = !isNaN(typedOdds) ? typedOdds : null; // manual-entry only -- no live price to fall back to for NFL
      var defaultStake = stakeForWin1(trackOdds);
      var entry = {
        trackId: scopedId, name: identity.name, gameId: gameId, marketKey: marketKey, side: side,
        matchLabel: teamLabel(g.away) + ' @ ' + teamLabel(g.home), league: 'NFL', date: g.date,
        rec: label, stars: null, odds: trackOdds, stake: defaultStake, status: 'pending', addedAt: Date.now()
      };
      arr.push(entry);
      saveTracked(arr);
      syncTrackButtons(baseTrackId, true);
      syncOddsInputs(baseTrackId, trackOdds);
      renderTracker();
      var revertAdd = function(){
        var arr2 = loadTracked().filter(function(t){ return t.trackId !== scopedId; });
        saveTracked(arr2); syncTrackButtons(baseTrackId, false);
        syncOddsInputs(baseTrackId, null);
        renderTracker();
      };
      postToServer({action:'upsert', name:identity.name, pin:identity.pin, pick: entryToServerPick(entry)}).then(function(res){
        if (!res || !res.ok) { revertAdd(); alert('Could not save: ' + ((res&&res.error)||'server error')); }
      }).catch(function(){ revertAdd(); alert('Could not reach the tracker sheet -- check your connection and try again.'); });
    }
  }

  function pushEntryUpdate(entry, revertFn){
    var identity = getIdentity();
    if (!identity) { revertFn(); alert('Sign in first (tap "Sign in" above the tracker list).'); return; }
    postToServer({action:'upsert', name:identity.name, pin:identity.pin, pick: entryToServerPick(entry)}).then(function(res){
      if (!res || !res.ok) { revertFn(); alert('Could not save: ' + ((res&&res.error)||'server error')); }
    }).catch(function(){ revertFn(); alert('Could not reach the tracker sheet -- change not saved.'); });
  }
  function updateStake(trackId, rawValue){
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===trackId; });
    if (!e) return;
    var prev = e.stake;
    e.stake = parseFloat(rawValue)||0;
    saveTracked(arr); renderTracker();
    pushEntryUpdate(e, function(){ e.stake = prev; saveTracked(arr); renderTracker(); });
  }
  function updateOdds(trackId, rawValue){
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===trackId; });
    if (!e) return;
    var prevOdds = e.odds, prevStake = e.stake;
    var v = String(rawValue).trim();
    e.odds = v === '' ? null : parseFloat(v);
    e.stake = stakeForWin1(e.odds);
    saveTracked(arr); renderTracker();
    pushEntryUpdate(e, function(){ e.odds = prevOdds; e.stake = prevStake; saveTracked(arr); renderTracker(); });
  }
  function syncOddsInputs(baseTrackId, value, title){
    var v = (value == null || value === '' || isNaN(value)) ? '' : String(value);
    document.querySelectorAll('[data-oddsinput="'+baseTrackId+'"]').forEach(function(inp){
      if (document.activeElement !== inp) inp.value = v;
      if (title) inp.title = title;
    });
  }
  function updateOddsFromMarketRow(baseTrackId, rawValue){
    var identity = getIdentity();
    if (!identity) return;
    var scoped = identity.name + '::' + baseTrackId;
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===scoped; });
    if (!e) return;
    var prevOdds = e.odds, prevStake = e.stake;
    var v = String(rawValue).trim();
    e.odds = v === '' ? null : parseFloat(v);
    if (isNaN(e.odds)) e.odds = null;
    e.stake = stakeForWin1(e.odds);
    saveTracked(arr);
    renderTracker();
    syncOddsInputs(baseTrackId, e.odds);
    pushEntryUpdate(e, function(){
      e.odds = prevOdds; e.stake = prevStake; saveTracked(arr); renderTracker();
      syncOddsInputs(baseTrackId, prevOdds);
    });
  }
  function updateStatus(trackId, status){
    var arr = loadTracked();
    var e = arr.find(function(x){ return x.trackId===trackId; });
    if (!e) return;
    var prev = e.status;
    e.status = (e.status === status) ? 'pending' : status;
    saveTracked(arr); renderTracker();
    pushEntryUpdate(e, function(){ e.status = prev; saveTracked(arr); renderTracker(); });
  }
  function removeTracked(trackId){
    var arr = loadTracked();
    var idx = arr.findIndex(function(x){ return x.trackId===trackId; });
    if (idx === -1) return;
    var removed = arr[idx];
    var baseTrackId = baseIdFromScoped(trackId);
    arr.splice(idx,1);
    saveTracked(arr); renderTracker(); syncTrackButtons(baseTrackId, false);
    var identity = getIdentity();
    var revert = function(){
      var arr2 = loadTracked(); arr2.push(removed); saveTracked(arr2);
      renderTracker(); syncTrackButtons(baseTrackId, true);
    };
    if (!identity) { revert(); alert('Sign in first (tap "Sign in" above the tracker list).'); return; }
    postToServer({action:'delete', name:identity.name, pin:identity.pin, trackId: trackId}).then(function(res){
      if (!res || !res.ok) { revert(); alert('Could not remove: ' + ((res&&res.error)||'server error')); }
    }).catch(function(){ revert(); alert('Could not reach the tracker sheet -- change not saved.'); });
  }

  function renderIdentityRow(){
    var row = document.getElementById('identityRow');
    if (!row) return;
    var identity = getIdentity();
    row.innerHTML = identity
      ? 'Signed in as <b>'+esc(identity.name)+'</b><button class="identity-switch" id="identitySwitchBtn">Switch</button>'
      : '<span>Not signed in</span><button class="identity-switch" id="identitySwitchBtn">Sign in</button>';
    var btn = document.getElementById('identitySwitchBtn');
    if (btn) btn.addEventListener('click', function(){
      clearIdentity();
      var id = ensureIdentity();
      renderTracker();
      resyncAllTrackButtons();
      if (id) syncFromServer();
    });
  }

  function renderTracker(){
    renderIdentityRow();
    var identity = getIdentity();
    var arr = loadTracked().sort(function(a,b){ return b.addedAt-a.addedAt; });
    var w=0,l=0,p=0, units=0;
    function fmtRec(n){ return (n % 1 === 0) ? String(n) : n.toFixed(1); }
    arr.forEach(function(e){
      if (e.status==='won') w+=1;
      else if (e.status==='lost') l+=1;
      else if (e.status==='push') p+=1;
      units += profitFor(e);
    });
    document.getElementById('tr-record').textContent = fmtRec(w)+'-'+fmtRec(l)+'-'+fmtRec(p);
    var decided = w+l;
    document.getElementById('tr-hitrate').textContent = decided ? Math.round(100*w/decided)+'%' : '–';
    document.getElementById('tr-units').textContent = (units>=0?'+':'') + units.toFixed(2);

    document.getElementById('trackerList').innerHTML = arr.length ? arr.map(function(e){
      var mine = !!(identity && e.name === identity.name);
      var head = '<div class="top"><div><div class="rec">'+esc(e.rec)+'</div><div class="match">'+esc(e.matchLabel)+' · '+esc(e.league)+' · '+esc(fmtDate(e.date?e.date.slice(0,10):e.date))+' · '+esc(e.name||'?')+'</div></div>'+
        (mine ? '<button class="remove-btn" data-remove="'+esc(e.trackId)+'">✕</button>' : '')+
      '</div>';
      if (!mine) {
        return '<div class="tcard" data-trackid="'+esc(e.trackId)+'">'+head+
          '<div class="row2">'+
            '<span>'+esc(e.odds!=null?e.odds:'–')+'</span>'+
            '<span>'+esc(e.stake)+'u</span>'+
            '<span class="status-chip '+esc(e.status)+'">'+esc(STATUS_LABELS[e.status]||e.status)+'</span>'+
          '</div>'+
        '</div>';
      }
      return '<div class="tcard" data-trackid="'+esc(e.trackId)+'">'+head+
        '<div class="row2">'+
          'Odds <input type="number" step="1" value="'+esc(e.odds!=null?e.odds:'')+'" data-odds="'+esc(e.trackId)+'" title="Type the odds you actually got at your sportsbook">'+
          'Stake <input type="number" min="0" step="0.25" value="'+esc(e.stake)+'" data-stake="'+esc(e.trackId)+'">'+
          '<button class="status-btn'+(e.status==='won'?' won':'')+'" data-status="won" data-id="'+esc(e.trackId)+'">Won</button>'+
          '<button class="status-btn'+(e.status==='push'?' push':'')+'" data-status="push" data-id="'+esc(e.trackId)+'">Push</button>'+
          '<button class="status-btn'+(e.status==='lost'?' lost':'')+'" data-status="lost" data-id="'+esc(e.trackId)+'">Lost</button>'+
        '</div>'+
      '</div>';
    }).join('') : '<div class="empty">No tracked bets yet. Tap a pick in Top Edges or Games and hit "Track".</div>';

    document.querySelectorAll('[data-stake]').forEach(function(inp){
      inp.addEventListener('change', function(){ updateStake(inp.getAttribute('data-stake'), inp.value); });
    });
    document.querySelectorAll('[data-odds]').forEach(function(inp){
      inp.addEventListener('change', function(){ updateOdds(inp.getAttribute('data-odds'), inp.value); });
    });
    document.querySelectorAll('[data-status]').forEach(function(btn){
      btn.addEventListener('click', function(){ updateStatus(btn.getAttribute('data-id'), btn.getAttribute('data-status')); });
    });
    document.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){ removeTracked(btn.getAttribute('data-remove')); });
    });
  }

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  // ---------- init ----------
  var gen = DATA.generatedAt ? new Date(DATA.generatedAt) : null;
  document.getElementById('genMeta').textContent = gen ? ('Updated ' + gen.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})) : '';
  buildWeekOptions();
  buildDayOptions();
  buildTimeOptions();
  renderTop();
  renderAts();
  renderTeaser();
  renderGames();
  renderTracker();
  syncFromServer();
})();
</script>
</body>
