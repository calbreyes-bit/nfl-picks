<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NFL Picks</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#16181d; --dim:#6b7280; --border:#e5e7eb;
    --accent:#2563eb; --accent-dim:#dbeafe; --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2; --amber:#d97706; --amber-bg:#fef3c7;
    --star:#f59e0b; --chip-bg:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#1a1d24; --text:#e8eaed; --dim:#9aa1ac; --border:#2a2e37;
      --accent:#5b9bff; --accent-dim:#1c2b47; --green:#4ade80; --green-bg:#0f2d1c;
      --red:#f87171; --red-bg:#3a1414; --amber:#fbbf24; --amber-bg:#3a2c0d;
      --star:#fbbf24; --chip-bg:#232732; --shadow:0 1px 2px rgba(0,0,0,.3),0 1px 8px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.4; padding-bottom:70px;
  }
  a{color:var(--accent);}
  header.top{
    position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--border);
    padding:10px 14px 0 14px;
  }
  header.top h1{font-size:17px; margin:2px 0 2px 0; font-weight:700;}
  header.top .meta{font-size:11px; color:var(--dim); margin-bottom:8px;}
  nav.tabs{display:flex; gap:4px;}
  nav.tabs button{
    flex:1; background:none; border:none; padding:10px 4px; font-size:13.5px; font-weight:600;
    color:var(--dim); border-bottom:2px solid transparent; cursor:pointer;
  }
  nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}
  main{padding:12px 12px 24px 12px; max-width:640px; margin:0 auto;}
  section.tab{display:none;}
  section.tab.active{display:block;}

  /* filter bar */
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .filters select, .filters input[type=search]{
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:7px 8px; font-size:13px; flex:1 1 auto; min-width:90px;
  }
  .filters .dropdown-btn{
    background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:7px 10px; font-size:13px; cursor:pointer; flex:1 1 auto; min-width:110px; text-align:left;
    position:relative;
  }
  .filters .dropdown-btn .count{color:var(--accent); font-weight:700;}
  .filters input[type=search]{flex:1 1 100%;}
  .dropdown-panel{
    display:none; position:fixed; left:12px; right:12px; z-index:50; background:var(--card);
    border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); max-height:60vh;
    overflow:auto; padding:10px;
  }
  .dropdown-panel.open{display:block;}
  .dropdown-panel .search{width:100%; margin-bottom:8px; padding:7px 8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
  .dropdown-panel .actions{display:flex; gap:8px; margin-bottom:8px;}
  .dropdown-panel .actions button{
    flex:1; padding:6px; border-radius:8px; border:1px solid var(--border); background:var(--chip-bg);
    color:var(--text); font-size:12.5px; cursor:pointer;
  }
  .dropdown-panel label{display:flex; align-items:center; gap:8px; padding:5px 2px; font-size:13.5px; cursor:pointer;}
  .dropdown-panel .backdrop-close{display:block; width:100%; margin-top:6px; padding:8px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-weight:600; cursor:pointer;}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40;}
  .scrim.open{display:block;}

  /* badges */
  .badge{
    width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:#fff; flex:none; overflow:hidden; background-size:cover; background-position:center;
    vertical-align:middle; border:2px solid var(--border);
  }
  .badge img{width:100%; height:100%; object-fit:cover; display:block;}
  .badge.sm{width:18px; height:18px; font-size:8.5px; border-width:1.5px;}
  .badge.lg{width:34px; height:34px; font-size:13px; border-width:2.5px;}

  /* fixture card */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .card .summary{padding:11px 13px; cursor:pointer;}
  .card .league-row{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); margin-bottom:7px;}
  .card .league-row .time{margin-left:auto; font-weight:600; color:var(--text);}
  .matchup{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .matchup .team{display:flex; align-items:center; gap:7px; flex:1; min-width:0;}
  .matchup .team span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; font-size:14px;}
  .matchup .vs{color:var(--dim); font-size:11px; flex:none;}
  .bb-line{
    display:flex; align-items:center; gap:8px; font-size:12.5px; padding:7px 9px; border-radius:9px;
    background:var(--accent-dim); color:var(--text);
  }
  .bb-line .edge-pct{color:var(--accent); font-weight:700; white-space:nowrap;}
  .bb-line.pass{background:var(--chip-bg); color:var(--dim);}

  /* expanded */
  .expand{border-top:1px solid var(--border); padding:12px 13px 14px 13px; display:none;}
  .expand.open{display:block;}
  .snapshot-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .snapshot-col h4{font-size:12px; margin:0 0 6px 0; display:flex; align-items:center; gap:6px;}
  .snapshot-col .stat{display:flex; justify-content:space-between; font-size:12px; padding:2px 0; color:var(--dim);}
  .snapshot-col .stat b{color:var(--text); font-weight:600;}
  .expected-box{background:var(--chip-bg); border-radius:10px; padding:9px 10px; margin-bottom:12px; font-size:12px;}
  .expected-box .row1{display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; color:var(--dim);}
  .expected-box .row1 b{color:var(--text);}
  .h2h-box{background:var(--chip-bg); border-radius:10px; padding:9px 10px; margin-bottom:12px; font-size:12px;}
  .h2h-box h4{font-size:12px; margin:0 0 6px 0; display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .h2h-box h4 .h2h-meta{font-weight:400; color:var(--dim); font-size:11px; white-space:nowrap;}
  .h2h-line{display:flex; justify-content:space-between; gap:8px; padding:2px 0; color:var(--dim);}
  .h2h-line b{color:var(--text);}
  .h2h-n{color:var(--dim); font-size:10.5px; margin-left:4px;}
  .h2h-results{margin-top:6px; padding-top:6px; border-top:1px solid var(--border);}
  .h2h-result{display:flex; justify-content:space-between; gap:8px; padding:1px 0; color:var(--dim); font-size:11.5px;}
  .h2h-result span:last-child{color:var(--text);}
  .h2h-empty{color:var(--dim); font-size:12px;}
  .injury-col-label{font-size:11px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.3px; margin-bottom:2px;}
  .injury-col-label:not(:first-child){margin-top:8px;}
  .injury-row{display:flex; justify-content:space-between; gap:8px; padding:2px 0; font-size:12px;}
  .injury-name{color:var(--text);}
  .injury-pos{color:var(--dim); font-size:10.5px;}
  .injury-status{font-weight:600; white-space:nowrap;}
  .injury-status.out{color:var(--red);}
  .injury-status.doubtful, .injury-status.questionable{color:var(--amber);}
  .injury-empty{color:var(--dim); font-size:12px;}
  .injury-more{margin-top:3px; font-size:11.5px; color:var(--dim);}
  .injury-more summary{cursor:pointer; padding:2px 0;}
  .injury-badge{display:inline-block; margin-left:4px; padding:0 5px; border-radius:6px; font-size:9.5px; font-weight:700; letter-spacing:.3px; background:var(--accent-dim); color:var(--accent); vertical-align:1px;}
  .lead-cat{font-size:11px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.3px; margin:9px 0 3px 0;}
  .lead-cat:first-of-type{margin-top:2px;}
  .lead-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:4px 12px;}
  .lead-grid > div{min-width:0;}
  .lead-team{font-size:10.5px; color:var(--dim); font-weight:600;}
  .lead-row{padding:2px 0; font-size:12px; min-width:0;}
  .lead-top{display:flex; justify-content:space-between; gap:6px;}
  .lead-name{color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .lead-main{font-weight:600; white-space:nowrap;}
  .lead-sub{color:var(--dim); font-size:10.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:0 6px;}
  .lead-avg{white-space:nowrap; color:var(--text); font-weight:600;}
  .lead-g{color:var(--dim); font-size:10px; font-weight:400; margin-left:3px;}
  .lead-more{margin-top:4px;}
  .lead-more summary{cursor:pointer; font-size:11.5px; color:var(--dim); padding:3px 0;}
  .prop-player{font-size:12px; font-weight:600; color:var(--text); margin:8px 0 2px 0;}
  .prop-player .injury-pos{font-weight:400;}
  .prop-head, .prop-row{display:grid; grid-template-columns:1.25fr .85fr .75fr .75fr .8fr; gap:4px; font-size:12px; align-items:baseline;}
  .prop-head{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.3px; padding:3px 0 2px 0; border-bottom:1px solid var(--border);}
  .prop-row{padding:2px 0; color:var(--text);}
  .prop-row .num{text-align:right; white-space:nowrap;}
  .prop-head .num{text-align:right;}
  .prop-sub{color:var(--dim); font-size:10.5px;}
  .prop-odds{grid-column:1 / -1; color:var(--dim); font-size:10.5px; margin-top:-1px;}
  .prop-gap.up{color:var(--green); font-weight:700;}
  .prop-gap.down{color:var(--red); font-weight:700;}
  .prop-note{margin-top:8px; font-size:10.5px; color:var(--dim); line-height:1.35;}
  .form-row{display:flex; justify-content:space-between; gap:8px; padding:1px 0; font-size:12px; color:var(--dim);}
  .form-row b{color:var(--text); font-weight:600;}
  .form-streak{font-weight:700; margin-left:3px;}
  .form-streak.w{color:var(--green);}
  .form-streak.l{color:var(--red);}
  .form-chips{display:flex; gap:4px; margin:4px 0 2px 0;}
  .form-chip{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:4px; font-size:10px; font-weight:700;}
  .form-chip.w{background:var(--green-bg); color:var(--green);}
  .form-chip.l{background:var(--red-bg); color:var(--red);}
  .form-chip.t{background:var(--chip-bg); color:var(--dim);}
  .form-empty{color:var(--dim); font-size:12px;}

  .market-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);
  }
  .market-row:last-child{border-bottom:none;}
  .market-row .label{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.03em; flex:none; width:64px; padding-top:1px;}
  .market-row .body{flex:1; min-width:0;}
  .market-row .rec{font-size:13px; font-weight:600;}
  .market-row .rec.pass{color:var(--dim); font-weight:500;}
  .market-row .edge-pct{color:var(--accent); font-size:12px; margin-left:4px; font-weight:700;}
  /* 2026-09-11 addition: star/PASS badge next to a market row's rec (see
     marketRowHtml's starHtml()) and the same star glyphs reused in the Best
     Bet banner (.bb-line .stars). */
  .stars{color:var(--accent); font-size:11px; margin-left:4px; letter-spacing:1px;}
  .bb-line .stars{color:var(--accent); font-size:12px; letter-spacing:1px;}
  .mkt-price{
    display:inline-block; background:var(--chip-bg); color:var(--text); font-size:11.5px; font-weight:700;
    padding:1px 7px; border-radius:8px; margin-left:5px; font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .market-row .reason{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .price-move{display:flex; align-items:center; gap:5px; margin-top:4px; font-size:11.5px; color:var(--dim);}
  .price-move .pm-val{font-weight:600; font-variant-numeric:tabular-nums; color:var(--text);}
  .price-move .pm-up{color:var(--green);}
  .price-move .pm-down{color:var(--red);}
  .track-btn{
    flex:none; border:1px solid var(--accent); color:var(--accent); background:none; border-radius:20px;
    font-size:11px; padding:4px 10px; cursor:pointer; font-weight:600; white-space:nowrap;
  }
  .track-btn.tracked{background:var(--accent); color:#fff;}
  .market-actions{display:flex; flex-direction:column; align-items:stretch; gap:4px; flex:none; width:72px;}
  .market-actions .track-btn{width:100%; text-align:center;}
  .market-odds-input{
    width:100%; box-sizing:border-box; padding:4px 5px; border-radius:7px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:11.5px; text-align:center; font-variant-numeric:tabular-nums;
  }
  .market-odds-input::placeholder{color:var(--dim);}

  .empty{text-align:center; color:var(--dim); padding:40px 10px; font-size:13.5px;}

  /* top edges */
  .edge-item{background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; box-shadow:var(--shadow); padding:11px 13px;}
  .edge-item .rank{font-size:11px; color:var(--dim); margin-bottom:6px;}
  .edge-item .em-body{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .edge-item .em-label{font-size:13.5px; font-weight:600;}
  .edge-item .em-pct{font-size:12.5px; font-weight:700; color:var(--accent); margin-left:6px;}
  .edge-item .mkt-price{margin-left:6px;}
  .ats-week-label{font-size:12px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; margin:2px 2px 10px 2px;}
  .ats-metrics{display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0;}
  .ats-metrics > div{display:flex; gap:6px; align-items:baseline; font-size:12px; white-space:nowrap;}
  .ats-metric-label{color:var(--dim);}
  .ats-metric-val{font-weight:700; color:var(--accent);}

  /* tracker */
  .tsum{display:flex; gap:8px; margin-bottom:14px;}
  .tsum .box{flex:1; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; text-align:center;}
  .tsum .box .n{font-size:18px; font-weight:800;}
  .tsum .box .l{font-size:10.5px; color:var(--dim); text-transform:uppercase;}
  .tcard{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:9px;}
  .tcard .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .tcard .rec{font-size:13px; font-weight:600;}
  .tcard .match{font-size:11.5px; color:var(--dim); margin-top:2px;}
  .tcard .row2{display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .tcard input[type=number]{width:56px; padding:5px 6px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12.5px;}
  .status-btn{flex:1; padding:6px; border-radius:7px; border:1px solid var(--border); background:var(--chip-bg); color:var(--text); font-size:11.5px; font-weight:600; cursor:pointer; min-width:52px;}
  .status-btn.won{background:var(--green-bg); color:var(--green); border-color:var(--green);}
  .status-btn.lost{background:var(--red-bg); color:var(--red); border-color:var(--red);}
  .status-btn.push{background:var(--amber-bg); color:var(--amber); border-color:var(--amber);}
  .remove-btn{background:none; border:none; color:var(--dim); font-size:16px; cursor:pointer; padding:0 2px;}
  .identity-row{font-size:12px; color:var(--dim); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px;}
  .identity-row b{color:var(--text);}
  .identity-switch{background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; padding:0;}
  .status-chip{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; background:var(--chip-bg); color:var(--dim);}
  .status-chip.won{background:var(--green-bg); color:var(--green);}
  .status-chip.lost{background:var(--red-bg); color:var(--red);}
  .status-chip.push{background:var(--amber-bg); color:var(--amber);}

  .footer-note{text-align:center; font-size:10.5px; color:var(--dim); padding:16px 10px 0 10px;}

  /* explicit theme choice (toggle) -- overrides both :root and prefers-color-scheme */
  :root[data-theme="light"]{
    --bg:#f4f5f7; --card:#ffffff; --text:#16181d; --dim:#6b7280; --border:#e5e7eb;
    --accent:#2563eb; --accent-dim:#dbeafe; --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2; --amber:#d97706; --amber-bg:#fef3c7;
    --star:#f59e0b; --chip-bg:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#0d1520; --text:#f2f5f9; --dim:#93a3b8; --border:#22303f;
    --accent:#6cabdd; --accent-dim:#16324f; --green:#4ade80; --green-bg:#0f2d1c;
    --red:#f87171; --red-bg:#3a1414; --amber:#fbbf24; --amber-bg:#3a2c0d;
    --star:#fbbf24; --chip-bg:#16202c; --shadow:0 1px 2px rgba(0,0,0,.6),0 1px 12px rgba(0,0,0,.5);
  }
  .theme-toggle-btn{
    position:absolute; top:9px; right:14px; background:var(--card); border:1px solid var(--border);
    border-radius:20px; padding:5px 10px; font-size:13px; line-height:1; cursor:pointer; color:var(--text);
  }
</style>
</head>
<body>

<header class="top">
  <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle light/dark theme">🌙</button>
  <h1>🏈 NFL Picks</h1>
  <div class="meta" id="genMeta"></div>
  <nav class="tabs">
    <button data-tab="top" class="active">Top Edges</button>
    <button data-tab="ats">ATS Picks</button>
    <button data-tab="teaser">7pt Teasers</button>
    <button data-tab="games">Games</button>
    <button data-tab="tracker">Tracker</button>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-top">
    <div id="topList"></div>
  </section>

  <section class="tab" id="tab-ats">
    <div id="atsList"></div>
  </section>

  <section class="tab" id="tab-teaser">
    <div id="teaserList"></div>
  </section>

  <section class="tab" id="tab-games">
    <div class="filters">
      <select id="f-week"><option value="">All weeks</option></select>
      <select id="f-day"><option value="">All days</option></select>
      <button class="dropdown-btn" id="f-time-btn">Kickoff <span class="count" id="f-time-count"></span></button>
      <input type="search" id="f-team" placeholder="Search team name…">
    </div>
    <div id="gameList"></div>
  </section>

  <section class="tab" id="tab-tracker">
    <div class="tsum">
      <div class="box"><div class="n" id="tr-record">0-0-0</div><div class="l">Record</div></div>
      <div class="box"><div class="n" id="tr-hitrate">–</div><div class="l">Hit rate</div></div>
      <div class="box"><div class="n" id="tr-units">0.00</div><div class="l">Units</div></div>
    </div>
    <div id="identityRow" class="identity-row"></div>
    <div id="trackerList"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="dropdown-panel" id="f-time-panel">
  <div class="actions">
    <button id="time-all">Select all</button>
    <button id="time-clear">Clear</button>
  </div>
  <div id="time-options"></div>
  <button class="backdrop-close" data-close>Done</button>
</div>

<script>

      // so a second "this.parentElement" read on the following statement is already null.
      return '<span class="'+cls+'"><img src="'+esc(logoUrl)+'" alt="" loading="lazy" ' +
             'onerror="var p=this.parentElement;p.innerHTML=\''+esc(initials(name))+'\';p.style.background=\''+bg+'\';"></span>';
    }
    return '<span class="'+cls+'" style="background:'+bg+'">'+esc(initials(name))+'</span>';
  }
  // Numeric formatting: every one of these guards null/NaN and returns the em-dash
  // placeholder instead of ever printing "null"/"undefined"/"NaN" (build_game_json()
  // in 09_push_dashboard.py can leave ANY field null -- missing model output, odds
  // not posted yet, etc).
  function isNum(v){ return typeof v === 'number' && isFinite(v); }
  function fmtNum(v, digits){
    if (!isNum(v)) return '–';
    return v.toFixed(digits==null?1:digits);
  }
  function fmtPct(v, digits){
    if (!isNum(v)) return '–';
    return (v*100).toFixed(digits==null?1:digits) + '%';
  }
  function fmtEdgePct(v){
    if (!isNum(v)) return '–';
    return (v>=0?'+':'') + (v*100).toFixed(1) + '%';
  }
  // Consensus (avg-across-books) American price for one market/side -- added 2026-09-08
  // once nfl_modeling_view.sql/09_push_dashboard.py started carrying an actual tradable
  // price through instead of just de-vigged probabilities. Distinct from the manual
  // market-odds-input (that one records what YOU actually got when placing the bet;
  // this one is the market's own current consensus price, same role as the label's
  // Model/Market probabilities right below it).
  function fmtAmerican(v){
    if (!isNum(v)) return null;
    return (v>0?'+':'') + v;
  }
  function fmtLine(v){
    if (!isNum(v)) return '–';
    return (Math.round(v*10)/10).toString();
  }
  function fmtSignedLine(v){
    if (!isNum(v)) return '–';
    // Carlos, 2026-09-12: display-only rounding to the nearest whole point.
    // spread.line is nfl_modeling_view.sql's avg(current_line) consensus
    // across bookmakers (see that view's spread_line_home comment), so it
    // naturally lands on off numbers like -6.9 that no single book ever
    // posts. Rounded here for readability only -- the underlying edge/margin
    // math upstream still uses the full unrounded consensus value.
    var r = Math.round(v);
    return (r>0?'+':'') + r;
  }
  function teamLabel(t){
    if (!t) return '–';
    return t.code || t.name || '–';
  }
  function fmtDate(dateStr){
    if(!dateStr) return '';
    var d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  }
  function fmtTime(timeStr){
    if(!timeStr) return '';
    var m = String(timeStr).match(/^(\d{1,2}):(\d{2})/);
    if(!m) return '';
    var h = parseInt(m[1],10), mm = m[2];
    var ap = h>=12 ? 'PM':'AM';
    var h12 = h%12; if (h12===0) h12=12;
    return h12+':'+mm+' '+ap;
  }
  function weekLabel(g){
    return g.week || (g.weekNumber!=null ? ('Week '+g.weekNumber) : '');
  }

  // ---------- line-move display: static "open -> now", no price history/sparkline
  // available for NFL (only current + opening line, not a full tick history) ----------
  function lineMoveHtml(line, openingLine){
    if (!isNum(line) || !isNum(openingLine)) return '';
    var diff = Math.round((line - openingLine)*100)/100;
    if (diff === 0) {
      return '<div class="price-move"><span>'+fmtLine(line)+' (open '+fmtLine(openingLine)+', unchanged)</span></div>';
    }
    var up = diff > 0;
    var arrow = up ? '▲' : '▼';
    var cls = up ? 'pm-up' : 'pm-down';
    return '<div class="price-move"><span class="pm-val">'+fmtLine(line)+'</span> (open '+fmtLine(openingLine)+
      ', <span class="pm-val '+cls+'">'+arrow+Math.abs(diff).toFixed(1)+'</span>)</div>';
  }

  // ---------- computeEdgeEntries: every qualifying market/side entry for one game ----------
  function computeEdgeEntries(g){
    var out = [];
    var home = g.home || {}, away = g.away || {};
    var ml = g.ml || {}, spread = g.spread || {}, total = g.total || {};
    var tt = g.teamTotal || {}, ttHome = tt.home || {}, ttAway = tt.away || {};

    if (isNum(ml.edgeHome)) {
      out.push({gameId:g.id, label: teamLabel(home)+' ML', edge: ml.edgeHome, price: ml.priceHome, marketKey:'ml', side:'home'});
    }
    if (isNum(ml.edgeAway)) {
      out.push({gameId:g.id, label: teamLabel(away)+' ML', edge: ml.edgeAway, price: ml.priceAway, marketKey:'ml', side:'away'});
    }
    if (isNum(spread.edgeHome) && isNum(spread.line)) {
      if (spread.edgeHome >= 0) {
        out.push({gameId:g.id, label: teamLabel(home)+' '+fmtSignedLine(spread.line), edge: spread.edgeHome, price: spread.priceHome, marketKey:'spread', side:'home'});
      } else {
        out.push({gameId:g.id, label: teamLabel(away)+' '+fmtSignedLine(-spread.line), edge: -spread.edgeHome, price: spread.priceAway, marketKey:'spread', side:'away'});
      }
    }
    if (isNum(total.edgeOver) && isNum(total.line)) {
      if (total.edgeOver >= 0) {
        out.push({gameId:g.id, label: 'Over '+fmtLine(total.line), edge: total.edgeOver, price: total.priceOver, marketKey:'total', side:'over'});
      } else {
        out.push({gameId:g.id, label: 'Under '+fmtLine(total.line), edge: -total.edgeOver, price: total.priceUnder, marketKey:'total', side:'under'});
      }
    }
    if (isNum(ttHome.edgeOver) && isNum(ttHome.line)) {
      if (ttHome.edgeOver >= 0) {
        out.push({gameId:g.id, label: teamLabel(home)+' TT Over '+fmtLine(ttHome.line), edge: ttHome.edgeOver, price: ttHome.priceOver, marketKey:'tt_home', side:'over'});
      } else {
        out.push({gameId:g.id, label: teamLabel(home)+' TT Under '+fmtLine(ttHome.line), edge: -ttHome.edgeOver, price: null, marketKey:'tt_home', side:'under'});
      }
    }
    if (isNum(ttAway.edgeOver) && isNum(ttAway.line)) {
      if (ttAway.edgeOver >= 0) {
        out.push({gameId:g.id, label: teamLabel(away)+' TT Over '+fmtLine(ttAway.line), edge: ttAway.edgeOver, price: ttAway.priceOver, marketKey:'tt_away', side:'over'});
      } else {
        out.push({gameId:g.id, label: teamLabel(away)+' TT Under '+fmtLine(ttAway.line), edge: -ttAway.edgeOver, price: null, marketKey:'tt_away', side:'under'});
      }
    }
    return out;
  }

  function findGame(id){ return GAMES.filter(function(g){ return g.id===id; })[0]; }

  function trackIdFor(gameId, marketKey, side){
    return gameId + ':' + marketKey + ':' + side;
  }

  function marketRecFromEntry(entry){
    // What actually gets tracked/stored for a given edge entry -- the human label doubles
    // as the "rec" text stored server-side (there's no separate short rec string for NFL,
    // unlike soccer's pick.rec).
    return entry.label;
  }

  // ---------- Track button + odds-input markup (reused by Top Edges and Games tabs) ----------
  // Odds input always starts blank: this data source only has de-vigged model/market
  // probabilities and lines, never a raw tradable price, so there is no NFL equivalent of
  // the soccer template's currentOddsFor() -- manual entry only, every time.
  function trackActionsHtml(gameId, marketKey, side, label, edge){
    var trackId = trackIdFor(gameId, marketKey, side);
    var tracked = isTracked(trackId);
    var trackedEntry = tracked ? findTrackedEntry(trackId) : null;
    var oddsVal = trackedEntry ? trackedEntry.odds : null;
    var oddsTitle = trackedEntry ? 'Tracked odds -- edit to update' : 'Odds to track (enter manually)';
    return '<div class="market-actions">'+
      '<input type="number" step="1" inputmode="numeric" class="market-odds-input" placeholder="odds" '+
        'title="'+esc(oddsTitle)+'" data-oddsinput="'+esc(trackId)+'" value="'+(oddsVal!=null?esc(String(oddsVal)):'')+'">'+
      '<button class="track-btn'+(tracked?' tracked':'')+'" data-track="'+esc(trackId)+'" data-game="'+esc(gameId)+'" '+
        'data-market="'+esc(marketKey)+'" data-side="'+esc(side)+'" data-label="'+esc(label)+'" data-edge="'+(edge!=null?edge:'')+'">'+
        (tracked?'Tracked':'Track')+'</button>'+
    '</div>';
  }

  // ---------- Top Edges tab ----------
  var TOP_EDGES_N = 20;
  function renderTop(){
    var all = [];
    GAMES.forEach(function(g){
      computeEdgeEntries(g).forEach(function(e){ all.push(e); });
    });
    all.sort(function(a,b){ return Math.abs(b.edge) - Math.abs(a.edge); });
    var top = all.slice(0, TOP_EDGES_N);
    if (!top.length) {
      document.getElementById('topList').innerHTML = '<div class="empty">No edges yet.</div>';
      return;
    }
    var html = top.map(function(e, i){
      var g = findGame(e.gameId);
      if (!g) return '';
      var matchLine = teamLabel(g.away)+' @ '+teamLabel(g.home)+' · '+esc(weekLabel(g))+' · '+esc(fmtDate(g.date));
      var priceStr = fmtAmerican(e.price);
      return '<div class="edge-item">'+
        '<div class="rank">#'+(i+1)+' &middot; '+matchLine+'</div>'+
        '<div class="em-body">'+
          '<div><div class="em-label">'+esc(e.label)+(priceStr!=null?' <span class="mkt-price">'+esc(priceStr)+'</span>':'')+'</div></div>'+
          '<div style="display:flex;align-items:center;gap:8px;">'+
            '<span class="em-pct">'+fmtEdgePct(e.edge)+' edge</span>'+
          '</div>'+
        '</div>'+
        trackActionsHtml(e.gameId, e.marketKey, e.side, e.label, e.edge)+
      '</div>';
    }).join('');
    document.getElementById('topList').innerHTML = html;
  }

  // ---------- ATS Picks tab (Carlos, 2026-09-10) ----------
  // Weekly contest: pick the 5 teams most likely to beat the spread by the biggest
  // margin. "This week" = the games sharing the earliest week label among all
  // upcoming games -- week_number is never populated by the ingest pipeline (see
  // nfl_ingest/ingest.py's transform_games), so week label + earliest game date is
  // the only reliable way to find "the next slate," and it's robust across
  // playoff/preseason labels too, not just "Week N" strings. Both the expected point
  // margin (Carlos's literal ask -- how many points the model expects that side to
  // beat the spread by) and the probability edge (same edge_home_cover/
  // edge_away_cover math as Top Edges) are shown side by side, per his choice --
  // they usually agree on direction but can disagree on ranking, and he wants to
  // compare rather than have one hidden.
  function currentWeekGames(){
    var upcoming = GAMES.filter(function(g){ return g.date && g.week; });
    if (!upcoming.length) return [];
    var earliestDate = upcoming.reduce(function(min, g){ return (!min || g.date < min) ? g.date : min; }, null);
    var earliestLabel = upcoming.filter(function(g){ return g.date === earliestDate; })[0].week;
    return upcoming.filter(function(g){ return g.week === earliestLabel; });
  }
  function computeAtsPicks(){
    var games = currentWeekGames();
    var out = [];
    games.forEach(function(g){
      var exp = g.expected||{}, spread = g.spread||{};
      if (!isNum(exp.margin) || !isNum(spread.line)) return;
      // spread.line is home-perspective, negative = home favored (see
      // nfl_modeling_view.sql). Home covers when actual_margin > -spread.line, i.e.
      // the model's expected cover margin for home = expected_margin + spread.line;
      // positive means the model likes home to cover, negative means away.
      var homeCoverMargin = exp.margin + spread.line;
      var pickHome = homeCoverMargin >= 0;
      out.push({
        gameId: g.id, homeTeam: g.home, awayTeam: g.away,
        pickTeam: pickHome ? g.home : g.away, pickIsHome: pickHome,
        line: pickHome ? spread.line : -spread.line,
        marginPts: Math.abs(homeCoverMargin),
        probEdge: isNum(spread.edgeHome) ? (pickHome ? spread.edgeHome : -spread.edgeHome) : null,
        price: pickHome ? spread.priceHome : spread.priceAway,
        date: g.date, time: g.time, week: g.week,
      });
    });
    out.sort(function(a,b){ return b.marginPts - a.marginPts; });
    return out.slice(0, 5);
  }
  function renderAts(){
    var picks = computeAtsPicks();
    var weekGames = currentWeekGames();
    var weekLbl = weekGames.length ? weekGames[0].week : null;
    var header = weekLbl ? '<div class="ats-week-label">'+esc(weekLbl)+' -- top 5 vs. the spread</div>' : '';
    if (!picks.length) {
      document.getElementById('atsList').innerHTML = header + '<div class="empty">No spread lines posted yet for the upcoming week.</div>';
      return;
    }
    var html = picks.map(function(p, i){
      var matchLine = teamLabel(p.awayTeam)+' @ '+teamLabel(p.homeTeam)+' &middot; '+esc(fmtDate(p.date))+(fmtTime(p.time)?' &middot; '+fmtTime(p.time):'');
      var priceStr = fmtAmerican(p.price);
      var pickName = (p.pickTeam||{}).name || teamLabel(p.pickTeam);
      var recLabel = teamLabel(p.pickTeam)+' '+fmtSignedLine(p.line);
      return '<div class="edge-item">'+
        '<div class="rank">#'+(i+1)+' &middot; '+matchLine+'</div>'+
        '<div class="em-body">'+
          '<div style="display:flex;align-items:center;gap:8px;">'+
            badge(teamLabel(p.pickTeam), (p.pickTeam||{}).logo, 'sm')+
            '<div class="em-label">'+esc(pickName)+' '+esc(fmtSignedLine(p.line))+
              (priceStr!=null?' <span class="mkt-price">'+esc(priceStr)+'</span>':'')+'</div>'+
          '</div>'+
          '<div class="ats-metrics">'+
            '<div><span class="ats-metric-label">Margin</span><span class="ats-metric-val">'+(p.marginPts>=0?'+':'')+fmtNum(p.marginPts,1)+' pts</span></div>'+
            '<div><span class="ats-metric-label">Edge</span><span class="ats-metric-val">'+fmtEdgePct(p.probEdge)+'</span></div>'+
          '</div>'+
        '</div>'+
        trackActionsHtml(p.gameId, 'spread', p.pickIsHome?'home':'away', recLabel, p.probEdge)+
      '</div>';
    }).join('');
    document.getElementById('atsList').innerHTML = header + html;
  }

  // ---------- 7-point teaser picks (Carlos, 2026-09-10) ----------
  // For each game this week, the more probable side of the spread and the more probable
  // side of the total AFTER a 7-point tease in that side's favor (nfl_modeling_view.sql's
  // teaser7_* columns -- see that file's header comment for the exact math: both sides get
  // their own +7 adjustment, so home/away or over/under are NOT complementary here, unlike
  // model_prob_home_cover/away_cover). g.teaser7 is always present in the payload
  // (build_game_json always emits the key) but every sub-field is null until a spread/total
  // line has actually posted for that game -- same "no data" convention as every other
  // market block on this dashboard. Same "current week only" scope as the ATS tab, not
  // capped to a top-N -- Carlos combines legs himself across games into his own teaser,
  // so the point is to see the whole week's candidates, not just the best few.
  function currentWeekTeaserPicks(){
    var games = currentWeekGames();
    var out = [];
    games.forEach(function(g){
      var t7 = g.teaser7 || {};
      if (!isNum(t7.spreadProb) && !isNum(t7.totalProb)) return;
      var home = g.home || {}, away = g.away || {};
      var spreadTeam = null;
      if (t7.spreadTeamId != null) {
        spreadTeam = (t7.spreadTeamId === home.id) ? home : (t7.spreadTeamId === away.id ? away : null);
      }
      out.push({
        gameId: g.id, homeTeam: home, awayTeam: away, date: g.date, time: g.time, week: g.week,
        spreadTeam: spreadTeam, spreadLine: t7.spreadLine, spreadProb: t7.spreadProb,
        totalSide: t7.totalSide, totalLine: t7.totalLine, totalProb: t7.totalProb,
        combinedProb: (isNum(t7.spreadProb) && isNum(t7.totalProb)) ? t7.spreadProb * t7.totalProb : null,
      });
    });
    out.sort(function(a, b){
      var av = isNum(a.combinedProb) ? a.combinedProb : Math.max(a.spreadProb || 0, a.totalProb || 0);
      var bv = isNum(b.combinedProb) ? b.combinedProb : Math.max(b.spreadProb || 0, b.totalProb || 0);
      return bv - av;
    });
    return out;
  }
  function renderTeaser(){
    var picks = currentWeekTeaserPicks();
    var weekGames = currentWeekGames();
    var weekLbl = weekGames.length ? weekGames[0].week : null;
    var header = weekLbl ? '<div class="ats-week-label">'+esc(weekLbl)+' -- most probable 7-point teaser legs</div>' : '';
    if (!picks.length) {
      document.getElementById('teaserList').innerHTML = header + '<div class="empty">No spread/total lines posted yet for the upcoming week.</div>';
      return;
    }
    var html = picks.map(function(p, i){
      var matchLine = teamLabel(p.awayTeam)+' @ '+teamLabel(p.homeTeam)+' &middot; '+esc(fmtDate(p.date))+(fmtTime(p.time)?' &middot; '+fmtTime(p.time):'');
      var spreadStr = (isNum(p.spreadLine) && p.spreadTeam) ? (teamLabel(p.spreadTeam)+' '+fmtSignedLine(p.spreadLine)) : '–';
      var totalStr = (isNum(p.totalLine) && p.totalSide) ? ((p.totalSide==='over'?'Over ':'Under ')+fmtLine(p.totalLine)) : '–';
      return '<div class="edge-item">'+
        '<div class="rank">#'+(i+1)+' &middot; '+matchLine+'</div>'+
        '<div class="em-body">'+
          '<div class="ats-metrics">'+
            '<div><span class="ats-metric-label">Spread leg</span><span class="ats-metric-val">'+esc(spreadStr)+(isNum(p.spreadProb)?' ('+fmtPct(p.spreadProb)+')':'')+'</span></div>'+
            '<div><span class="ats-metric-label">Total leg</span><span class="ats-metric-val">'+esc(totalStr)+(isNum(p.totalProb)?' ('+fmtPct(p.totalProb)+')':'')+'</span></div>'+
            (isNum(p.combinedProb)?'<div><span class="ats-metric-label">Both legs</span><span class="ats-metric-val">'+fmtPct(p.combinedProb)+'</span></div>':'')+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
    document.getElementById('teaserList').innerHTML = header + html;
  }

  // ---------- market row rendering for the Games tab expanded view ----------
  // 2026-09-11 addition: star/note render the same v1 scoring rule that
  // drives the Best Bet banner (topEdgeTeaser above) -- 0 stars shows as
  // "PASS" (reusing the .rec.pass styling that was already defined in CSS
  // but never wired up), 1-5 stars shows as filled stars, both with the
  // scoring reason as a hover title. star/note are undefined on the
  // non-picked side of a market (each market recommends exactly one side,
  // never both) and on any card from before this was deployed (older
  // cached g.picks-less payloads) -- either way starHtml() below renders
  // nothing, so this is a purely additive, backward-compatible change.
  function starHtml(star, note){
    if (star == null) return '';
    if (star <= 0) return ' <span class="rec pass" title="'+esc(note||'Below the scoring floor')+'">PASS</span>';
    return ' <span class="stars" title="'+esc(note||(star+' star'+(star===1?'':'s')))+'">'+'★'.repeat(star)+'</span>';
  }

  function marketRowHtml(label, teamName, modelProb, marketProb, edge, lineHtml, gameId, marketKey, side, recLabel, price, star, note){
    var labelHtml = '<div class="label">'+esc(label)+(teamName?'<br><span style="opacity:.6">'+esc(teamName)+'</span>':'')+'</div>';
    var priceStr = fmtAmerican(price);
    return '<div class="market-row">'+labelHtml+
      '<div class="body">'+
        '<span class="rec">'+esc(recLabel)+'</span>'+(priceStr!=null?' <span class="mkt-price">'+esc(priceStr)+'</span>':'')+(isNum(edge)?' <span class="edge-pct">'+fmtEdgePct(edge)+'</span>':'')+starHtml(star, note)+
        '<div class="reason">Model '+fmtPct(modelProb)+' &middot; Market '+fmtPct(marketProb)+'</div>'+
        (lineHtml||'')+
      '</div>'+
      trackActionsHtml(gameId, marketKey, side, recLabel, edge)+
    '</div>';
  }

  function marketsHtml(g){
    var out = '';
    var home = g.home||{}, away = g.away||{};
    var ml = g.ml||{}, spread = g.spread||{}, total = g.total||{};
    var tt = g.teamTotal||{}, ttHome = tt.home||{}, ttAway = tt.away||{};
    // g.picks.<market>.side names which single side (of the two rendered
    // below) is the actual v1 recommendation -- the star/PASS badge only
    // ever appears on that one row, never the mirror side, same "exactly
    // one recommendation per market" rule nfl_scoring_view.sql scores.
    var picks = g.picks || {};
    var mlPick = picks.ml || {}, spreadPick = picks.spread || {}, totalPick = picks.total || {};
    var homeTtPick = picks.homeTt || {}, awayTtPick = picks.awayTt || {};

    // Gate every row on the *market* quantity being present (marketProb for ML, `line`
    // for spread/total/team-total below) rather than the model quantity alone -- a game
    // whose odds simply haven't posted yet (model already has a probability, but there's
    // no market to compare it to or bet into) has no real "market row" to show, same as
    // spread/total/team-total already being gated on their own `line` field.
    if (isNum(ml.marketHome)) {
      out += marketRowHtml('ML', teamLabel(home), ml.modelHome, ml.marketHome, ml.edgeHome, '', g.id, 'ml', 'home', teamLabel(home)+' ML', ml.priceHome,
        mlPick.side==='home'?mlPick.star:null, mlPick.side==='home'?mlPick.note:null);
    }
    if (isNum(ml.marketAway)) {
      out += marketRowHtml('ML', teamLabel(away), ml.modelAway, ml.marketAway, ml.edgeAway, '', g.id, 'ml', 'away', teamLabel(away)+' ML', ml.priceAway,
        mlPick.side==='away'?mlPick.star:null, mlPick.side==='away'?mlPick.note:null);
    }
    if (isNum(spread.line)) {
      var lm = lineMoveHtml(spread.line, spread.openingLine);
      if (isNum(spread.modelHomeCover) || isNum(spread.marketHomeCover) || isNum(spread.edgeHome)) {
        out += marketRowHtml('Spread', teamLabel(home)+' '+fmtSignedLine(spread.line), spread.modelHomeCover, spread.marketHomeCover, spread.edgeHome, lm, g.id, 'spread', 'home', teamLabel(home)+' '+fmtSignedLine(spread.line), spread.priceHome,
          spreadPick.side==='home'?spreadPick.star:null, spreadPick.side==='home'?spreadPick.note:null);
      }
      if (isNum(spread.modelAwayCover) || isNum(spread.marketAwayCover)) {
        var edgeAway = isNum(spread.edgeHome) ? -spread.edgeHome : null;
        out += marketRowHtml('Spread', teamLabel(away)+' '+fmtSignedLine(-spread.line), spread.modelAwayCover, spread.marketAwayCover, edgeAway, lm, g.id, 'spread', 'away', teamLabel(away)+' '+fmtSignedLine(-spread.line), spread.priceAway,
          spreadPick.side==='away'?spreadPick.star:null, spreadPick.side==='away'?spreadPick.note:null);
      }
    }
    if (isNum(total.line)) {
      var lmT = lineMoveHtml(total.line, total.openingLine);
      if (isNum(total.modelOver) || isNum(total.marketOver) || isNum(total.edgeOver)) {
        out += marketRowHtml('Total', 'Over '+fmtLine(total.line), total.modelOver, total.marketOver, total.edgeOver, lmT, g.id, 'total', 'over', 'Over '+fmtLine(total.line), total.priceOver,
          totalPick.side==='over'?totalPick.star:null, totalPick.side==='over'?totalPick.note:null);
      }
      if (isNum(total.modelUnder) || isNum(total.marketUnder)) {
        var edgeUnder = isNum(total.edgeOver) ? -total.edgeOver : null;
        out += marketRowHtml('Total', 'Under '+fmtLine(total.line), total.modelUnder, total.marketUnder, edgeUnder, lmT, g.id, 'total', 'under', 'Under '+fmtLine(total.line), total.priceUnder,
          totalPick.side==='under'?totalPick.star:null, totalPick.side==='under'?totalPick.note:null);
      }
    }
    // TT rows: only the Over side is ever rendered here (a pre-existing gap --
    // the Games tab never had an Under row for team totals, unlike the game
    // Total market above). So the star badge only shows when the v1
    // recommendation actually landed on Over; a TT Under pick still counts
    // correctly for Best Bet/PASS purposes, it just has no row to attach a
    // badge to in this view yet.
    if (isNum(ttHome.line) && (isNum(ttHome.modelOver) || isNum(ttHome.marketOver) || isNum(ttHome.edgeOver))) {
      out += marketRowHtml('TT '+teamLabel(home), 'Over '+fmtLine(ttHome.line), ttHome.modelOver, ttHome.marketOver, ttHome.edgeOver, '', g.id, 'tt_home', 'over', teamLabel(home)+' TT Over '+fmtLine(ttHome.line), ttHome.priceOver,
        homeTtPick.side==='over'?homeTtPick.star:null, homeTtPick.side==='over'?homeTtPick.note:null);
    }
    if (isNum(ttAway.line) && (isNum(ttAway.modelOver) || isNum(ttAway.marketOver) || isNum(ttAway.edgeOver))) {
      out += marketRowHtml('TT '+teamLabel(away), 'Over '+fmtLine(ttAway.line), ttAway.modelOver, ttAway.marketOver, ttAway.edgeOver, '', g.id, 'tt_away', 'over', teamLabel(away)+' TT Over '+fmtLine(ttAway.line), ttAway.priceOver,
        awayTtPick.side==='over'?awayTtPick.star:null, awayTtPick.side==='over'?awayTtPick.note:null);
    }
    return out;
  }

  function snapshotHtml(g){
    var ratings = g.ratings||{}, scoring = g.scoring||{}, expected = g.expected||{};
    var home = g.home||{}, away = g.away||{};
    // venueLabel/venueScored/venueAllowed/venueGames are optional (Carlos, 2026-09-09):
    // the home team's scoring specifically AT HOME, or the away team's specifically ON THE
    // ROAD -- i.e. each team's number in the exact role it's about to play, distinct from
    // the season-wide avgScored/avgAllowed above. Renders nothing when there's no venue
    // data yet (a team with zero completed games at that venue) rather than showing a
    // stray "– scored / – allowed" line -- same "don't show what you don't have" approach
    // as the rest of this dashboard.
    function col(team, elo, asOf, avgScored, avgAllowed, logo, venueLabel, venueScored, venueAllowed, venueGames){
      var venueLine = '';
      if (isNum(venueScored) || isNum(venueAllowed)) {
        venueLine = '<div class="stat">'+esc(venueLabel)+' <span><b>'+fmtNum(venueScored,1)+'</b> scored / <b>'+fmtNum(venueAllowed,1)+'</b> allowed'+
          (isNum(venueGames)?' <span class="h2h-n">(N='+venueGames+')</span>':'')+'</span></div>';
      }
      return '<div class="snapshot-col">'+
        '<h4>'+badge(teamLabel(team), logo, 'sm')+' '+esc(team.name||teamLabel(team))+'</h4>'+
        '<div class="stat">Elo <b>'+(isNum(elo)?fmtNum(elo,0):'–')+'</b></div>'+
        '<div class="stat">As of <b>'+(asOf?esc(fmtDate(asOf.slice(0,10))):'–')+'</b></div>'+
        '<div class="stat">Avg scored <b>'+fmtNum(avgScored,1)+'</b></div>'+
        '<div class="stat">Avg allowed <b>'+fmtNum(avgAllowed,1)+'</b></div>'+
        venueLine+
      '</div>';
    }
    var grid = '<div class="snapshot-grid">'+
      col(home, ratings.homeElo, ratings.homeAsOf, scoring.homeAvgScored, scoring.homeAvgAllowed, home.logo,
          'At home', scoring.homeAvgScoredAtHome, scoring.homeAvgAllowedAtHome, scoring.homeVenueGamesPlayed)+
      col(away, ratings.awayElo, ratings.awayAsOf, scoring.awayAvgScored, scoring.awayAvgAllowed, away.logo,
          'On road', scoring.awayAvgScoredOnRoad, scoring.awayAvgAllowedOnRoad, scoring.awayVenueGamesPlayed)+
    '</div>';
    var hasExpected = isNum(expected.margin) || isNum(expected.total) || isNum(expected.teamHome) || isNum(expected.teamAway);
    var expectedHtml = '';
    if (hasExpected) {
      expectedHtml = '<div class="expected-box"><div class="row1">'+
        '<span>Exp. margin <b>'+(isNum(expected.margin)?(expected.margin>0?'+':'')+fmtNum(expected.margin,1):'–')+'</b></span>'+
        '<span>Exp. total <b>'+fmtNum(expected.total,1)+'</b></span>'+
        '<span>Exp. '+esc(teamLabel(home))+' <b>'+fmtNum(expected.teamHome,1)+'</b></span>'+
        '<span>Exp. '+esc(teamLabel(away))+' <b>'+fmtNum(expected.teamAway,1)+'</b></span>'+
      '</div></div>';
    }
    return grid + expectedHtml;
  }

  // ---------- head-to-head box (Carlos, 2026-09-08) ----------
  // g.h2h is always present in the payload (build_game_json always emits the key) but
  // every field is null when the two teams have never met in nfl.games' 2010-present
  // archive -- never fabricated, same "no data" convention as every other missing field
  // on this dashboard. currentVenueMeetings/reverseVenueMeetings are shown alongside
  // every average on purpose: NFL matchup frequency is wildly uneven (divisional rivals
  // meet twice a season, cross-conference pairs can go years between meetings), so an
  // average here can rest on an N of 1 -- Carlos sees the N and judges for himself
  // rather than it being hidden or gated below some floor.
  function h2hHtml(g){
    var h2h = g.h2h || {};
    var home = g.home||{}, away = g.away||{};
    if (!isNum(h2h.meetings) || h2h.meetings <= 0) {
      return '<div class="h2h-box"><h4>Head-to-Head</h4><div class="h2h-empty">No meetings on record (2010–present)</div></div>';
    }
    var lines = '';
    if (h2h.currentVenueMeetings) {
      lines += '<div class="h2h-line"><span>'+esc(teamLabel(home))+' hosting '+esc(teamLabel(away))+'</span>'+
        '<span><b>'+fmtNum(h2h.homeAvgScoredHosting,1)+'</b>–<b>'+fmtNum(h2h.awayAvgScoredVisiting,1)+'</b> avg pts'+
        '<span class="h2h-n">(N='+h2h.currentVenueMeetings+')</span></span></div>';
    }
    if (h2h.reverseVenueMeetings) {
      lines += '<div class="h2h-line"><span>'+esc(teamLabel(away))+' hosting '+esc(teamLabel(home))+'</span>'+
        '<span><b>'+fmtNum(h2h.awayAvgScoredHosting,1)+'</b>–<b>'+fmtNum(h2h.homeAvgScoredVisiting,1)+'</b> avg pts'+
        '<span class="h2h-n">(N='+h2h.reverseVenueMeetings+')</span></span></div>';
    }
    var results = (h2h.results||[]).map(function(r){
      var homeIsCurrentHome = r.homeTeamId === home.id;
      var leftName = esc(homeIsCurrentHome ? teamLabel(home) : teamLabel(away));
      var rightName = esc(homeIsCurrentHome ? teamLabel(away) : teamLabel(home));
      return '<div class="h2h-result"><span>'+esc(fmtDate(r.date))+'</span>'+
        '<span>'+leftName+' '+r.homeScore+' – '+r.awayScore+' '+rightName+'</span></div>';
    }).join('');
    var meta = h2h.meetings+' meeting'+(h2h.meetings===1?'':'s')+(h2h.lastMeetingDate?' · last '+esc(fmtDate(h2h.lastMeetingDate)):'');
    return '<div class="h2h-box"><h4><span>Head-to-Head</span><span class="h2h-meta">'+meta+'</span></h4>'+
      lines + (results?'<div class="h2h-results">'+results+'</div>':'') +
    '</div>';
  }

  // ---------- injuries box (Carlos, 2026-09-09) ----------
  // g.injuries is always present in the payload (build_game_json always emits the
  // key) but injuries.home/injuries.away are null, not an empty list, when that
  // team has no injuries pulled yet -- run/08b_injuries.py is manual/on-demand
  // (Carlos's choice), not part of every pipeline run, so a null here means "not
  // checked", shown as "No data", never rendered as "confirmed healthy". Key skill
  // positions only (QB/RB/WR/TE) -- filtered server-side in nfl_modeling_view.sql,
  // an O-line/D-line/special-teams injury never reaches this payload.
  function injuryStatusClass(status){
    var s = (status||'').toLowerCase();
    if (s.indexOf('out') === 0 || s === 'ir' || s.indexOf('injured reserve') >= 0 ||
        s.indexOf('sidelined') === 0 || s === 'i.l.' || s === 'pup' || s === 'nfi') return 'out';
    if (s.indexOf('doubtful') === 0) return 'doubtful';
    if (s.indexOf('questionable') === 0) return 'questionable';
    return '';
  }
  // 2026-10-05 (Carlos): every position now, not only QB/RB/WR/TE. g.injuries.allPositions is true when the
  // payload came from nfl.v_team_all_injuries; each entry then carries leaderIn (which of the team's top-3 leader
  // categories the player is in) and is already sorted leaders-first, then by severity. Position is blank for
  // players the roster pull doesn't know (never guessed). First 8 per team shown, the rest under "more".
  var LEADER_ABBR = {passing:'PASS', rushing:'RUSH', receiving:'REC', tackles:'TKL', sacks:'SACK', interceptions:'INT'};
  function injuryRowHtml(p){
    var cls = injuryStatusClass(p.status);
    var badge = (p.leaderIn && p.leaderIn.length)
      ? '<span class="injury-badge" title="Top-3 on this team in: '+esc(p.leaderIn.join(', '))+'">LEADER · '+
        esc(p.leaderIn.map(function(c){ return LEADER_ABBR[c]||c; }).join('/'))+'</span>' : '';
    return '<div class="injury-row" title="'+esc(p.description||'')+'">'+
      '<span class="injury-name">'+esc(p.playerName)+(p.position?' <span class="injury-pos">'+esc(p.position)+'</span>':'')+badge+'</span>'+
      '<span class="injury-status'+(cls?' '+cls:'')+'">'+esc(p.status||'–')+'</span>'+
    '</div>';
  }
  function injuryListHtml(list){
    if (!list || !list.length) return '<div class="injury-empty">No data</div>';
    var shown = list.slice(0, 8).map(injuryRowHtml).join('');
    var rest = list.slice(8);
    if (!rest.length) return shown;
    return shown + '<details class="injury-more"><summary>'+rest.length+' more</summary>'+rest.map(injuryRowHtml).join('')+'</details>';
  }
  function injuriesHtml(g){
    var inj = g.injuries||{};
    var home = g.home||{}, away = g.away||{};
    return '<div class="h2h-box">'+
      '<h4><span>Injuries</span><span class="h2h-meta">'+(inj.allPositions?'All positions':'QB/RB/WR/TE')+'</span></h4>'+
      '<div class="injury-col-label">'+esc(teamLabel(away))+'</div>'+
      injuryListHtml(inj.away)+
      '<div class="injury-col-label">'+esc(teamLabel(home))+'</div>'+
      injuryListHtml(inj.home)+
    '</div>';
  }

  // ---------- team leaders box (Carlos, 2026-10-05) ----------
  // g.leaders.home/away = {passing:[...], rushing:[...], receiving:[...], tackles:[...], sacks:[...],
  // interceptions:[...]}, top 3 each, season to date (nfl_leaders_view.sql). null = no completed games with
  // player stats for that team yet -> "No data", never a blank that reads as "no leaders".
  function fmtN(n){
    if (n == null) return '–';
    n = Number(n);
    return (n % 1 ? n.toFixed(1) : String(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function perGame(total, games, digits){
    return (games > 0 && total != null) ? (Number(total)/games).toFixed(digits == null ? 1 : digits) : null;
  }
  // Each category: main = season total of the headline stat, avg = that stat per game played, sub = the other
  // counting stats with their own per-game average in parentheses (games = games the player appeared in).
  function withAvg(total, games, label, digits){
    var a = perGame(total, games, digits);
    return fmtN(total) + ' ' + label + (a != null ? ' (' + a + '/g)' : '');
  }
  var LEAD_DEFS = [
    {key:'passing',       label:'Passing',
      main:function(p){ return fmtN(p.stats.yds)+' yds'; },
      avg:function(p){ var a=perGame(p.stats.yds,p.games); return a?a+' yds/g':''; },
      sub:function(p){ return withAvg(p.stats.td,p.games,'TD',2)+' · '+fmtN(p.stats['int'])+' INT'; }},
    {key:'rushing',       label:'Rushing',
      main:function(p){ return fmtN(p.stats.yds)+' yds'; },
      avg:function(p){ var a=perGame(p.stats.yds,p.games); return a?a+' yds/g':''; },
      sub:function(p){ return withAvg(p.stats.att,p.games,'att')+' · '+fmtN(p.stats.td)+' TD'; }},
    {key:'receiving',     label:'Receiving',
      main:function(p){ return fmtN(p.stats.yds)+' yds'; },
      avg:function(p){ var a=perGame(p.stats.yds,p.games); return a?a+' yds/g':''; },
      sub:function(p){ return withAvg(p.stats.rec,p.games,'rec')+' · '+fmtN(p.stats.td)+' TD'; }},
    {key:'tackles',       label:'Defense · Tackles',  defense:true,
      main:function(p){ return fmtN(p.stats.tackles)+' tkl'; },
      avg:function(p){ var a=perGame(p.stats.tackles,p.games); return a?a+' tkl/g':''; },
      sub:function(p){ return fmtN(p.stats.tfl)+' TFL · '+fmtN(p.stats.passDef)+' PD'; }},
    {key:'sacks',         label:'Defense · Sacks',    defense:true,
      main:function(p){ return fmtN(p.stats.sacks)+' sk'; },
      avg:function(p){ var a=perGame(p.stats.sacks,p.games,2); return a?a+' sk/g':''; },
      sub:function(p){ return fmtN(p.stats.tackles)+' tkl'; }},
    {key:'interceptions', label:'Defense · INTs',     defense:true,
      main:function(p){ return fmtN(p.stats['int'])+' int'; },
      avg:function(p){ var a=perGame(p.stats['int'],p.games,2); return a?a+' int/g':''; },
      sub:function(p){ return fmtN(p.stats.passDef)+' PD'; }}
  ];
  function leaderSectionHtml(def, lead, away, home){
    function col(team, side){
      var list = lead && lead[side] ? lead[side][def.key] : null;
      if (!list || !list.length) return '<div><div class="lead-team">'+esc(teamLabel(team))+'</div><div class="injury-empty">–</div></div>';
      return '<div><div class="lead-team">'+esc(teamLabel(team))+'</div>'+list.map(function(p){
        return '<div class="lead-row"><div class="lead-top"><span class="lead-name">'+esc(p.playerName)+
          (p.position?' <span class="injury-pos">'+esc(p.position)+'</span>':'')+' <span class="lead-g">'+p.games+' G</span></span>'+
          '<span class="lead-main">'+esc(def.main(p))+'</span></div>'+
          '<div class="lead-sub"><span>'+esc(def.sub(p))+'</span><span class="lead-avg">'+esc(def.avg(p))+'</span></div></div>';
      }).join('')+'</div>';
    }
    return '<div class="lead-cat">'+esc(def.label)+'</div><div class="lead-grid">'+col(away,'away')+col(home,'home')+'</div>';
  }
  function leadersHtml(g){
    var lead = g.leaders||{};
    if (!lead.home && !lead.away) {
      return '<div class="h2h-box"><h4><span>Team Leaders</span><span class="h2h-meta">season to date</span></h4><div class="h2h-empty">No data</div></div>';
    }
    var away = g.away||{}, home = g.home||{};
    var offense = LEAD_DEFS.filter(function(d){ return !d.defense; }).map(function(d){ return leaderSectionHtml(d, lead, away, home); }).join('');
    var defense = LEAD_DEFS.filter(function(d){ return d.defense; }).map(function(d){ return leaderSectionHtml(d, lead, away, home); }).join('');
    return '<div class="h2h-box"><h4><span>Team Leaders</span><span class="h2h-meta">season to date · top 3 · avg per game played</span></h4>'+
      offense+'<details class="lead-more"><summary>Defense leaders</summary>'+defense+'</details></div>';
  }

  // ---------- player props vs. averages box (Carlos, 2026-10-05) ----------
  // g.props = {home:[...], away:[...], asOf}. Each entry: one player + one market with the consensus posted line,
  // best over/under (or yes) price, and the player's season / last-3 per-game average (per game appeared in).
  // Context only, not a pick: lines come from 1-2 books and are posted about a day before kickoff; averages
  // ignore opponent and role changes. Anytime TD compares the share of games with a rush/rec TD to the implied
  // probability of the posted price (no vig removed). Whole section is absent until props are posted.
  var PROP_LABELS = {pass_yds:'Pass yds', pass_cmp:'Completions', pass_td:'Pass TD', pass_int:'INT thrown', rush_yds:'Rush yds',
    rush_att:'Rush att', rec_yds:'Rec yds', rush_rec_yds:'Rush+Rec yds', pass_rush_yds:'Pass+Rush yds', anytime_td:'Anytime TD'};
  function fmtOdd(o){ return o == null ? '–' : (o > 0 ? '+' + o : String(o)); }
  function fmtAvg(x, market){
    if (x == null) return '–';
    if (market === 'anytime_td') return Math.round(x*100) + '%';
    return (Math.abs(x) >= 100 ? x.toFixed(0) : x.toFixed(1));
  }
  function propRowHtml(r){
    var isTd = r.market === 'anytime_td';
    var lineCell, gapTxt = '', gapCls = '', oddsLine = '';
    if (isTd){
      var imp = r.yesDec ? 1 / r.yesDec : null;
      lineCell = fmtOdd(r.yesOdd) + (imp != null ? ' <span class="prop-sub">'+Math.round(imp*100)+'%</span>' : '');
      if (imp != null && r.avg != null){
        var pts = (r.avg - imp) * 100;
        gapTxt = (pts > 0 ? '+' : '') + Math.round(pts) + ' pts';
        gapCls = pts >= 10 ? 'up' : (pts <= -10 ? 'down' : '');
      }
    } else {
      lineCell = r.line != null ? r.line.toFixed(1) : '–';
      if (r.avg != null && r.line != null){
        var diff = r.avg - r.line;
        gapTxt = (diff > 0 ? '+' : '') + (Math.abs(diff) >= 100 ? diff.toFixed(0) : diff.toFixed(1));
        var rel = r.line ? diff / r.line : 0;
        gapCls = rel >= 0.10 ? 'up' : (rel <= -0.10 ? 'down' : '');
      }
      oddsLine = 'O '+fmtOdd(r.overOdd)+' · U '+fmtOdd(r.underOdd);
    }
    var range = (!isTd && r.lineMin != null && r.lineMax != null && r.lineMin !== r.lineMax) ? ' · lines '+r.lineMin.toFixed(1)+'–'+r.lineMax.toFixed(1) : '';
    var sub = (oddsLine ? oddsLine + ' · ' : '') + r.books + ' book' + (r.books === 1 ? '' : 's') + range;
    return '<div class="prop-row">'+
      '<span>'+esc(PROP_LABELS[r.market]||r.market)+'</span>'+
      '<span class="num">'+lineCell+'</span>'+
      '<span class="num">'+esc(fmtAvg(r.avg, r.market))+'</span>'+
      '<span class="num">'+esc(fmtAvg(r.last3, r.market))+'</span>'+
      '<span class="num prop-gap'+(gapCls?' '+gapCls:'')+'">'+esc(gapTxt||'–')+'</span>'+
      '<span class="prop-odds">'+esc(sub)+'</span>'+
    '</div>';
  }
  function propsTeamHtml(team, list){
    var rows = (list||[]).filter(function(r){ return r.avg != null && r.games > 0; });
    if (!rows.length) return '';
    var byPlayer = [], seen = {};
    rows.forEach(function(r){
      if (!seen[r.player]) { seen[r.player] = {name:r.player, pos:r.pos, games:r.games, rows:[]}; byPlayer.push(seen[r.player]); }
      seen[r.player].rows.push(r);
    });
    return '<div class="injury-col-label">'+esc(teamLabel(team))+'</div>'+
      '<div class="prop-head"><span>Prop</span><span class="num">Line</span><span class="num">Avg</span><span class="num">L3</span><span class="num">Avg–line</span></div>'+
      byPlayer.map(function(p){
        return '<div class="prop-player">'+esc(p.name)+(p.pos?' <span class="injury-pos">'+esc(p.pos)+'</span>':'')+
               ' <span class="prop-sub">'+p.games+' G</span></div>'+p.rows.map(propRowHtml).join('');
      }).join('');
  }
  function propsHtml(g){
    var pr = g.props||{};
    var away = g.away||{}, home = g.home||{};
    var body = propsTeamHtml(away, pr.away) + propsTeamHtml(home, pr.home);
    if (!body) return '';
    var n = ((pr.away||[]).length + (pr.home||[]).length);
    return '<div class="h2h-box"><details class="lead-more" open style="margin:0"><summary><b>Player props vs. averages</b> <span class="h2h-meta">'+n+' lines'+(pr.asOf?' · pulled '+esc(fmtDate(pr.asOf.slice(0,10))):'')+'</span></summary>'+
      body+
      '<div class="prop-note">Avg = season per game played, L3 = last 3 games. Green/red = average at least 10% above/below the line. '+
      'Anytime TD compares the % of games with a rushing/receiving TD to the price\'s implied probability. Lines come from 1–2 books and are posted about a day before kickoff. Context, not a pick.</div>'+
    '</details></div>';
  }

  // ---------- recent form box (Carlos, 2026-09-10) ----------
  // g.form is always present (build_game_json always emits the key) but
  // form.home/form.away are null field-by-field, not fabricated zeros, for a
  // team with zero completed games (a brand-new franchise, or before Week 1)
  // -- same "never fabricate" convention as injuries above. recentGames comes
  // most-recent-first from the backend; reversed here so the chip row reads
  // oldest-to-newest left-to-right, ending at "now" on the right.
  function formStreakLabel(result, length){
    if (!result || !isNum(length) || length <= 0) return '';
    return result + length;
  }
  function formRecordHtml(f){
    if (!f || !isNum(f.gamesPlayed) || f.gamesPlayed <= 0) return '<div class="form-empty">No data</div>';
    var record = f.wins + '-' + f.losses + (f.ties ? '-' + f.ties : '');
    var streak = formStreakLabel(f.streakResult, f.streakLength);
    var streakCls = f.streakResult === 'W' ? 'w' : (f.streakResult === 'L' ? 'l' : '');
    var chips = (f.recentGames||[]).slice().reverse().map(function(rg){
      var cls = rg.result === 'W' ? 'w' : (rg.result === 'L' ? 'l' : 't');
      return '<span class="form-chip '+cls+'" title="'+esc(fmtDate(rg.date))+': '+rg.pointsScored+'-'+rg.pointsAllowed+'">'+esc(rg.result)+'</span>';
    }).join('');
    return '<div class="form-row"><span>Last '+f.gamesPlayed+': <b>'+esc(record)+'</b>'+
        (streak?' <span class="form-streak '+streakCls+'">'+esc(streak)+'</span>':'')+'</span>'+
      '<span>'+fmtNum(f.avgScored,1)+' / '+fmtNum(f.avgAllowed,1)+' avg</span></div>'+
      '<div class="form-chips">'+chips+'</div>';
  }
  function formHtml(g){
    var form = g.form||{};
    var home = g.home||{}, away = g.away||{};
    return '<div class="h2h-box">'+
      '<h4><span>Recent Form</span><span class="h2h-meta">Last 5</span></h4>'+
      '<div class="injury-col-label">'+esc(teamLabel(away))+'</div>'+
      formRecordHtml(form.away)+
      '<div class="injury-col-label">'+esc(teamLabel(home))+'</div>'+
      formRecordHtml(form.home)+
    '</div>';
  }

  // 2026-09-11 rewrite: this used to sort computeEdgeEntries() by raw |edge|
  // and show whichever won -- no floor (a thin-sample N=1 edge could lead
  // the board) and a live tie-break bug (home ML and away ML edges are
  // near-mirror images, so JS's stable sort kept the home side on a tie
  // regardless of which side actually had the positive edge -- confirmed
  // live on the Rutgers @ Boston College card, which banner'd "Boston
  // College ML -12.1% edge" when the real pick was Rutgers ML at +12.1%).
  // Best Bet now comes from the server (g.picks.bestBet, computed by
  // nfl.v_future_games_scored -- see nfl_scoring_view.sql for the full v1
  // scoring rule), which already fixes both problems: only positive-edge
  // sides are ever candidates, and a sample-size cap knocks a thin-data
  // edge down instead of letting it win. This function's only job now is
  // to find that market/side's already-correctly-formatted label (from
  // computeEdgeEntries, so the label text never drifts out of sync with
  // the rest of the card) and render it, or show Skip when every market
  // PASSed.
  function topEdgeTeaser(g){
    var best = (g.picks || {}).bestBet;
    if (!best) return '<div class="bb-line pass">Skip — no picks clear the bar</div>';
    var entries = computeEdgeEntries(g);
    var match = entries.filter(function(e){ return e.marketKey === best.market && e.side === best.side; })[0];
    if (!match) return '<div class="bb-line pass">Skip — no picks clear the bar</div>';
    return '<div class="bb-line"><span>'+esc(match.label)+'</span>'+
      '<span class="stars" title="'+best.star+' star'+(best.star===1?'':'s')+'">'+'★'.repeat(best.star)+'</span>'+
      '<span class="edge-pct">'+fmtEdgePct(best.edge)+' edge</span></div>';
  }

  // ---------- Games tab / filters ----------
  // Date + Kickoff filters (added 2026-09-10, Carlos: "add the Date and Kickoff
  // time filters the same as in the Match Day Dashboard") -- mirrors Match Day
  // Board's Fixtures-tab f-day/f-time pattern exactly (same dropdown-panel CSS,
  // already present in this file but unused until now), adapted to this
  // dashboard's g.date/g.time fields instead of fx.date/fx.ts.
  var timeSet = [];
  var timeSelected = new Set();

  function buildDayOptions(){
    var days = Array.from(new Set(GAMES.map(function(g){ return g.date; }))).filter(Boolean).sort();
    var sel = document.getElementById('f-day');
    days.forEach(function(d){
      var o = document.createElement('option'); o.value = d; o.textContent = fmtDate(d); sel.appendChild(o);
    });
  }

  function buildTimeOptions(){
    timeSet = Array.from(new Set(GAMES.map(function(g){ return fmtTime(g.time); }))).filter(Boolean).sort(function(a,b){
      // sort chronologically by parsing back to minutes-ish (same trick as Match Day Board's f-time)
      function toMinutes(t){
        var m = t.match(/(\d+):(\d+)\s*([AP]M)/i);
        if(!m) return 0;
        var h = parseInt(m[1],10)%12; if(/pm/i.test(m[3])) h+=12;
        return h*60+parseInt(m[2],10);
      }
      return toMinutes(a)-toMinutes(b);
    });
    timeSelected = new Set(timeSet);
    renderTimeOptions();
    updateTimeCount();
  }
  function renderTimeOptions(){
    var box = document.getElementById('time-options');
    box.innerHTML = timeSet.map(function(t){
      var checked = timeSelected.has(t) ? 'checked' : '';
      return '<label><input type="checkbox" value="'+esc(t)+'" '+checked+' class="time-cb"> '+esc(t)+'</label>';
    }).join('');
    box.querySelectorAll('.time-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        if (cb.checked) timeSelected.add(cb.value); else timeSelected.delete(cb.value);
        updateTimeCount(); renderGames();
      });
    });
  }
  function updateTimeCount(){
    var tc = document.getElementById('f-time-count');
    tc.textContent = (timeSelected.size && timeSelected.size < timeSet.length) ? '('+timeSelected.size+')' : '';
  }
  function openPanel(panel){
    document.getElementById('scrim').classList.add('open');
    panel.classList.add('open');
    panel.style.top = '90px';
  }
  function closeAllPanels(){
    document.querySelectorAll('.dropdown-panel').forEach(function(p){ p.classList.remove('open'); });
    document.getElementById('scrim').classList.remove('open');
  }

  function weekSortKey(g){
    return {week: g.week, weekNumber: g.weekNumber, date: g.date};
  }
  function buildWeekOptions(){
    var seen = {};
    var weeks = [];
    GAMES.forEach(function(g){
      var w = g.week;
      if (!w || seen[w]) return;
      seen[w] = true;
      weeks.push({week: w, weekNumber: g.weekNumber, date: g.date});
    });
    weeks.sort(function(a,b){
      var an = a.weekNumber, bn = b.weekNumber;
      if (an!=null && bn!=null) return an-bn;
      if (an!=null) return -1;
      if (bn!=null) return 1;
      return (a.date||'').localeCompare(b.date||'');
    });
    var sel = document.getElementById('f-week');
    weeks.forEach(function(w){
      var o = document.createElement('option'); o.value = w.week; o.textContent = w.week; sel.appendChild(o);
    });
  }

  function passesGameFilters(g){
    var week = document.getElementById('f-week').value;
    if (week && g.week !== week) return false;
    var day = document.getElementById('f-day').value;
    if (day && g.date !== day) return false;
    if (timeSet.length && timeSelected.size < timeSet.length && !timeSelected.has(fmtTime(g.time))) return false;
    var teamQ = document.getElementById('f-team').value.trim().toLowerCase();
    if (teamQ) {
      var home = g.home||{}, away = g.away||{};
      var hay = [home.name, home.code, away.name, away.code].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(teamQ) === -1) return false;
    }
    return true;
  }

  function renderGames(){
    var list = GAMES.filter(passesGameFilters);
    document.getElementById('gameList').innerHTML = list.length
      ? list.map(cardHtml).join('')
      : '<div class="empty">No games match these filters.</div>';
  }

  // ---------- expand/collapse + track/odds delegation ----------
  document.addEventListener('click', function(e){

  // ---------- tabs ----------
  document.querySelectorAll('nav.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('nav.tabs button').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('section.tab').forEach(function(s){ s.classList.remove('active'); });
